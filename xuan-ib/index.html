<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="XUAN-投资管理">
  <meta name="theme-color" content="#f9f9f7">
  <title>XUAN-投资管理</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #f9f9f7; }
    .app { height: 100%; display: flex; flex-direction: column; }
    .bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 64px;
      padding: calc(10px + env(safe-area-inset-top)) 18px 10px;
      border-bottom: 1px solid #deddd8;
      background: rgba(249, 249, 247, .96);
      color: #111;
    }
    .title { min-width: 0; }
    .title strong { display: block; font-size: 18px; line-height: 1.25; }
    #status { display: block; margin-top: 2px; color: #6d6b67; font-size: 12px; }
    #status.error { color: #b3261e; }
    #refresh {
      flex: 0 0 auto;
      appearance: none;
      border: 1px solid #80afe6;
      border-radius: 999px;
      padding: 8px 15px;
      background: #eef5fc;
      color: #216ec8;
      font: inherit;
      font-weight: 650;
    }
    #refresh:disabled { opacity: .55; }
    #handover { flex: 1 1 auto; min-height: 0; width: 100%; border: 0; background: #f9f9f7; }
    @media (prefers-color-scheme: dark) {
      html, body, #handover { background: #0d0d0d; }
      .bar { background: rgba(13, 13, 13, .96); border-color: #2c2c2a; color: #fff; }
      #status { color: #aaa8a2; }
      #refresh { border-color: #397fcf; background: #10253d; color: #68a8ee; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="title">
        <strong>XUAN-投资管理</strong>
        <span id="status" role="status" aria-live="polite">正在读取最新版…</span>
      </div>
      <button id="refresh" type="button">刷新</button>
    </header>
    <iframe id="handover" title="XUAN-投资管理 最新简报" sandbox="" referrerpolicy="no-referrer"></iframe>
  </div>
  <script>
    (() => {
      let frame = document.querySelector("#handover");
      const button = document.querySelector("#refresh");
      const status = document.querySelector("#status");
      const loaderBuild = "2026-08-26.1";
      let lastSuccess = 0;
      let lastAttempt = 0;
      let lastHtml = "";
      let requestSequence = 0;

      // Migration window: the phone page must keep working while published
      // handovers still carry the previous product name. The first entry is the
      // title every future candidate must use; the second is the title already
      // live in latest.html and is dropped once that page has been republished.
      const approvedTitles = [
        "<title>XUAN-投资管理</title>",
        "<title>XUAN-IB 睡前交接</title>"
      ];

      const clock = () => new Intl.DateTimeFormat("zh-HK", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false,
        timeZone: "Asia/Hong_Kong"
      }).format(new Date());

      const dataDate = (html) => {
        const match = html.match(/<span class="date">(\d{4}-\d{2}-\d{2})\b/);
        return match ? match[1].slice(5) : "日期未知";
      };

      function reloadLoader() {
        const url = new URL(location.href);
        url.searchParams.set("loader", `${loaderBuild}-${Date.now()}`);
        location.replace(url);
      }

      function loadDirect(request) {
        const url = new URL("latest.html", location.href);
        url.searchParams.set("direct", `${loaderBuild}-${Date.now()}`);
        const replacement = document.createElement("iframe");
        replacement.id = "handover";
        replacement.title = "XUAN-投资管理 最新简报";
        replacement.setAttribute("sandbox", "");
        replacement.setAttribute("referrerpolicy", "no-referrer");
        replacement.hidden = true;
        status.classList.add("error");
        status.textContent = `网络读取异常，正在切换直接模式… · L ${loaderBuild}`;
        frame.before(replacement);
        replacement.addEventListener("load", () => {
          if (request !== requestSequence) {
            replacement.remove();
            return;
          }
          frame.remove();
          replacement.hidden = false;
          frame = replacement;
          status.textContent = `直接模式已打开 ${clock()}（内容未校验）· L ${loaderBuild}`;
        }, { once: true });
        replacement.addEventListener("error", () => {
          if (request !== requestSequence) {
            replacement.remove();
            return;
          }
          replacement.remove();
          status.textContent = "直接读取也失败，仍显示上一版";
        }, { once: true });
        replacement.src = url;
      }

      async function loadLatest() {
        const request = ++requestSequence;
        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), 10_000);
        lastAttempt = Date.now();
        button.disabled = true;
        status.classList.remove("error");
        status.textContent = lastHtml ? "正在核对最新版…" : "正在读取最新版…";
        try {
          const url = new URL("latest.html", location.href);
          url.searchParams.set("v", String(Date.now()));
          const response = await fetch(url, {
            cache: "no-store",
            credentials: "omit",
            signal: controller.signal
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const html = await response.text();
          if (request !== requestSequence) return;
          if (!html.includes("xuan-ib-handover:v1") ||
              !approvedTitles.some((title) => html.includes(title))) {
            throw new Error("页面完整性标记不符");
          }
          const csp = '<meta http-equiv="Content-Security-Policy" content="default-src &apos;none&apos;; style-src &apos;unsafe-inline&apos;; script-src &apos;none&apos;; img-src &apos;none&apos;; font-src &apos;none&apos;; media-src &apos;none&apos;; connect-src &apos;none&apos;; frame-src &apos;none&apos;; object-src &apos;none&apos;; base-uri &apos;none&apos;; form-action &apos;none&apos;">';
          const protectedHtml = html.replace(/<head[^>]*>/i, (head) => head + csp);
          if (protectedHtml === html) throw new Error("页面缺少安全头");
          frame.srcdoc = protectedHtml;
          lastHtml = protectedHtml;
          lastSuccess = Date.now();
          status.textContent = `已同步 ${clock()} · 数据 ${dataDate(html)} · L ${loaderBuild}`;
        } catch (error) {
          if (request !== requestSequence) return;
          if (error.name === "AbortError" || error instanceof TypeError) {
            loadDirect(request);
            return;
          }
          status.classList.add("error");
          status.textContent = lastHtml ? "更新失败，仍显示上一版" : "暂时无法读取最新版，请重试";
          if (!lastHtml) {
            frame.srcdoc = "<!doctype html><meta name=viewport content='width=device-width,initial-scale=1'><style>body{font:16px -apple-system,sans-serif;padding:28px;color:#555}button{font:inherit}</style><p>暂时无法读取最新交接页，请稍后点击上方“刷新”。</p>";
          }
          console.warn("XUAN-IB latest-page refresh failed", error);
        } finally {
          window.clearTimeout(timeout);
          if (request === requestSequence) button.disabled = false;
        }
      }

      button.addEventListener("click", reloadLoader);
      window.addEventListener("pageshow", (event) => {
        if (event.persisted) reloadLoader();
        else loadLatest();
      });
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && Date.now() - lastAttempt > 60_000) reloadLoader();
      });
      window.setInterval(() => {
        if (!document.hidden && Date.now() - lastAttempt > 5 * 60_000) loadLatest();
      }, 60_000);
    })();
  </script>
</body>
</html>
