<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="XUAN-投资管理">
  <meta name="theme-color" content="#f9f9f7">
  <title>XUAN-投资管理</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #f9f9f7; }
    .app { height: 100%; display: flex; flex-direction: column; }
    .bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 64px;
      padding: calc(10px + env(safe-area-inset-top)) 18px 10px;
      border-bottom: 1px solid #deddd8;
      background: rgba(249, 249, 247, .96);
      color: #111;
    }
    .title { min-width: 0; }
    .title strong { display: block; font-size: 18px; line-height: 1.25; }
    #status { display: block; margin-top: 2px; color: #6d6b67; font-size: 12px; }
    #status.error { color: #b3261e; }
    .header-actions {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    #adhoc,
    #refresh {
      flex: 0 0 auto;
      appearance: none;
      border-radius: 999px;
      font: inherit;
      font-weight: 650;
    }
    #adhoc {
      border: 1px solid #8a75d1;
      padding: 5px 10px 4px;
      background: #f3efff;
      color: #5c43b6;
      line-height: 1.15;
      text-align: center;
      text-decoration: none;
    }
    #adhoc span,
    #adhoc small { display: block; white-space: nowrap; }
    #adhoc span { font-size: 12px; }
    #adhoc small { margin-top: 2px; font-size: 9px; font-weight: 600; }
    #refresh {
      border: 1px solid #80afe6;
      padding: 8px 13px;
      background: #eef5fc;
      color: #216ec8;
    }
    #refresh:disabled { opacity: .55; }
    #warning {
      flex: 0 0 auto;
      padding: 10px 18px;
      border-bottom: 1px solid #e0a33a;
      background: #fff1cf;
      color: #6f4200;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
      text-align: center;
    }
    #warning[hidden] { display: none; }
    #handover { flex: 1 1 auto; min-height: 0; width: 100%; border: 0; background: #f9f9f7; }
    @media (prefers-color-scheme: dark) {
      html, body, #handover { background: #0d0d0d; }
      .bar { background: rgba(13, 13, 13, .96); border-color: #2c2c2a; color: #fff; }
      #status { color: #aaa8a2; }
      #adhoc { border-color: #7059c6; background: #211b3a; color: #bcaeff; }
      #refresh { border-color: #397fcf; background: #10253d; color: #68a8ee; }
      #warning { border-color: #7b5820; background: #3b2b0e; color: #ffd98c; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="title">
        <strong>XUAN-投资管理</strong>
        <span id="status" role="status" aria-live="polite">正在读取最新版…</span>
      </div>
      <div class="header-actions">
        <a id="adhoc"
           href="shortcuts://run-shortcut?name=XUAN-IB%20%E4%B8%B4%E6%97%B6%E6%8A%A5%E5%91%8A"
           rel="noopener noreferrer"
           aria-label="通过 iPhone 快捷指令启动 Claude 临时报告；完成后自动刷新">
          <span>生成临时报告</span>
          <small>一键启动 · 自动刷新</small>
        </a>
        <button id="refresh" type="button">刷新</button>
      </div>
    </header>
    <div id="warning" role="alert" hidden>上游暂不一致，正在显示上一份已验证版本</div>
    <iframe id="handover" title="XUAN-投资管理 最新简报" sandbox="" referrerpolicy="no-referrer"></iframe>
  </div>
  <script>
    (() => {
      const frame = document.querySelector("#handover");
      const button = document.querySelector("#refresh");
      const adhocButton = document.querySelector("#adhoc");
      const status = document.querySelector("#status");
      const warning = document.querySelector("#warning");
      const loaderBuild = "2026-08-29.5";
      const storageKey = "xuan-ib:last-verified:v1";
      const adhocWaitStorageKey = "xuan-ib:adhoc-wait:v1";
      const adhocPollMs = 15_000;
      const adhocWaitMs = 20 * 60_000;
      let lastSuccess = 0;
      let lastAttempt = 0;
      let lastVerified = null;
      let requestSequence = 0;
      let adhocWait = null;

      // Migration window: the phone page must keep working while published
      // handovers still carry the previous product name. The first entry is the
      // title every future candidate must use; the second is the title already
      // live in latest.html and is dropped once that page has been republished.
      const approvedTitles = [
        "<title>XUAN-投资管理</title>",
        "<title>XUAN-IB 睡前交接</title>"
      ];

      const clock = () => new Intl.DateTimeFormat("zh-HK", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false,
        timeZone: "Asia/Hong_Kong"
      }).format(new Date());

      const storage = (() => {
        try {
          localStorage.setItem("__xuan_ib_probe", "1");
          localStorage.removeItem("__xuan_ib_probe");
          return localStorage;
        } catch (_) {
          return null;
        }
      })();

      const reportVersion = (record) => ({
        dataDate: record.meta.dataDate,
        sourceCommitEpoch: record.meta.sourceCommitEpoch,
        htmlBlob: record.meta.htmlBlob.toLowerCase()
      });

      const validReportVersion = (version) => version &&
        /^\d{4}-\d{2}-\d{2}$/.test(version.dataDate || "") &&
        Number.isInteger(version.sourceCommitEpoch) && version.sourceCommitEpoch > 0 &&
        /^[0-9a-f]{40}$/i.test(version.htmlBlob || "");

      const reportIsNewerThan = (record, baseline) =>
        record.meta.dataDate > baseline.dataDate ||
        (record.meta.dataDate === baseline.dataDate &&
          record.meta.sourceCommitEpoch > baseline.sourceCommitEpoch);

      function persistAdhocWait() {
        if (!storage || !adhocWait) return;
        try {
          storage.setItem(adhocWaitStorageKey, JSON.stringify(adhocWait));
        } catch (error) {
          console.warn("XUAN-IB ad-hoc wait backup failed", error);
        }
      }

      function clearAdhocWait() {
        adhocWait = null;
        if (!storage) return;
        try { storage.removeItem(adhocWaitStorageKey); } catch (_) {}
      }

      function restoreAdhocWait() {
        if (!storage) return;
        try {
          const raw = storage.getItem(adhocWaitStorageKey);
          if (!raw) return;
          const saved = JSON.parse(raw);
          const valid = saved.cacheVersion === 1 &&
            Number.isInteger(saved.startedAt) &&
            Number.isInteger(saved.deadline) &&
            saved.deadline > Date.now() &&
            (saved.baseline === null || validReportVersion(saved.baseline));
          if (!valid) throw new Error("saved ad-hoc wait is invalid or expired");
          adhocWait = saved;
        } catch (error) {
          clearAdhocWait();
          console.warn("XUAN-IB saved ad-hoc wait was rejected", error);
        }
      }

      function showAdhocPending() {
        status.classList.remove("error");
        status.textContent = `临时报告正在生成，请稍候 · L ${loaderBuild}`;
      }

      function expireAdhocWait() {
        if (!adhocWait || Date.now() <= adhocWait.deadline) return false;
        clearAdhocWait();
        status.classList.add("error");
        status.textContent = `临时报告尚未完成，请稍后刷新 · L ${loaderBuild}`;
        return true;
      }

      function updateAdhocWait(record) {
        if (!adhocWait || expireAdhocWait()) return false;
        if (!adhocWait.baseline) {
          adhocWait.baseline = reportVersion(record);
          persistAdhocWait();
          showAdhocPending();
          return false;
        }
        if (!reportIsNewerThan(record, adhocWait.baseline)) {
          showAdhocPending();
          return false;
        }
        // latest.meta.json does not yet identify the report class. Complete the
        // request only when the already verified HTML labels the newer report
        // as ad-hoc; a scheduled publication may still render, but cannot
        // falsely claim that the user's ad-hoc request has finished.
        if (classifyEdition(record.info.edition) !== "adhoc") {
          showAdhocPending();
          return false;
        }
        clearAdhocWait();
        status.classList.toggle("error", !warning.hidden);
        status.textContent = statusFor(record, "临时报告已完成");
        return true;
      }

      function beginAdhocWait() {
        const now = Date.now();
        adhocWait = {
          cacheVersion: 1,
          startedAt: now,
          deadline: now + adhocWaitMs,
          baseline: lastVerified ? reportVersion(lastVerified) : null
        };
        persistAdhocWait();
        showAdhocPending();
        return loadLatest();
      }

      const hex = (buffer) => Array.from(new Uint8Array(buffer), (byte) =>
        byte.toString(16).padStart(2, "0")
      ).join("");

      async function gitBlobSha(bytes) {
        const body = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
        const header = new TextEncoder().encode(`blob ${body.byteLength}\0`);
        const payload = new Uint8Array(header.byteLength + body.byteLength);
        payload.set(header, 0);
        payload.set(body, header.byteLength);
        return hex(await crypto.subtle.digest("SHA-1", payload));
      }

      const decodeUtf8 = (bytes) =>
        new TextDecoder("utf-8", { fatal: true }).decode(bytes);

      const canonicalizeTransportInjection = (bytes) => {
        const maxPublishedBytes = 2_000_000;
        const maxTransportOverhead = 64 * 1024;
        if (bytes.byteLength >= maxPublishedBytes + maxTransportOverhead) return null;
        const html = decodeUtf8(bytes);
        const externalScript = /<script\b(?=[^>]*[\t\n\f\r ]src[\t\n\f\r ]*=)[^>]*>[\s\S]*?<\/script[\t\n\f\r ]*>/gi;
        const injected = html.match(externalScript) || [];
        if (!injected.length || injected.length > 4) return null;
        const encoder = new TextEncoder();
        const removedBytes = injected.reduce(
          (total, script) => total + encoder.encode(script).byteLength,
          0
        );
        if (removedBytes > maxTransportOverhead) return null;
        const canonicalBytes = encoder.encode(html.replace(externalScript, ""));
        if (canonicalBytes.byteLength >= maxPublishedBytes ||
            bytes.byteLength - canonicalBytes.byteLength !== removedBytes) return null;
        return canonicalBytes;
      };

      const reportInfo = (html) => {
        const match = html.match(/<span\s+class=["']date["'][^>]*>([\s\S]*?)<\/span>/i);
        if (!match) throw new Error("页面缺少报告日期与版次");
        const text = match[1]
          .replace(/<[^>]*>/g, " ")
          .replace(/&nbsp;|&#160;/gi, " ")
          .replace(/&middot;|&#183;/gi, "·")
          .replace(/\s+/g, " ")
          .trim();
        const date = text.match(/^(\d{4}-\d{2}-\d{2})\b/);
        const parts = text.split("·").map((part) => part.trim()).filter(Boolean);
        if (!date || parts.length < 2) throw new Error("报告日期或版次无法识别");
        return { dataDate: date[1], edition: parts[1], label: text };
      };

      const hktContext = (now = new Date()) => {
        const shifted = new Date(now.getTime() + 8 * 60 * 60 * 1000);
        return {
          date: shifted.toISOString().slice(0, 10),
          weekday: shifted.getUTCDay(),
          minuteOfDay: shifted.getUTCHours() * 60 + shifted.getUTCMinutes()
        };
      };

      const addIsoDays = (date, days) => {
        const value = new Date(`${date}T00:00:00Z`);
        value.setUTCDate(value.getUTCDate() + days);
        return value.toISOString().slice(0, 10);
      };

      const hktSlots = {
        am: { startMinute: 8 * 60, dueMinute: 8 * 60 + 35, weekdays: new Set([2, 3, 4, 5, 6]) },
        pm: { startMinute: 20 * 60 + 55, dueMinute: 21 * 60 + 25, weekdays: new Set([1, 2, 3, 4, 5]) }
      };

      const hktSlotEpoch = (date, edition, minuteKey) => Math.floor(
        (Date.parse(`${date}T00:00:00Z`) - 8 * 60 * 60 * 1000 +
          hktSlots[edition][minuteKey] * 60 * 1000) / 1000
      );

      const expectedBusinessEdition = (now = new Date()) => {
        const context = hktContext(now);
        const nowEpoch = Math.floor(now.getTime() / 1000);
        let latest = null;
        for (let offset = 0; offset <= 8; offset += 1) {
          const date = addIsoDays(context.date, -offset);
          const weekday = new Date(`${date}T00:00:00Z`).getUTCDay();
          for (const edition of ["am", "pm"]) {
            if (!hktSlots[edition].weekdays.has(weekday)) continue;
            const dueEpoch = hktSlotEpoch(date, edition, "dueMinute");
            if (dueEpoch > nowEpoch) continue;
            if (!latest || dueEpoch > latest.dueEpoch) latest = { dataDate: date, edition, dueEpoch };
          }
        }
        if (!latest) throw new Error("无法确定最近应完成的香港报告版次");
        return {
          ...latest,
          startEpoch: hktSlotEpoch(latest.dataDate, latest.edition, "startMinute"),
          label: latest.edition === "am" ? "早间版" : "睡前版"
        };
      };

      const classifyEdition = (edition) => {
        const value = String(edition).toLowerCase();
        if (/计划外|加跑|补跑|临时|ad[ -]?hoc/.test(value)) return "adhoc";
        if (/睡前|晚间|定时正式版|\bpm\b/.test(value)) return "pm";
        if (/早间|上午|早班|\bam\b/.test(value)) return "am";
        return "unknown";
      };

      const staleMessage = (record, now = new Date()) => {
        const expected = expectedBusinessEdition(now);
        const actualEdition = classifyEdition(record.info.edition);
        const dateBehind = record.info.dataDate < expected.dataDate;
        const editionRank = {am: 1, pm: 2};
        const adHocBeforeSlot = actualEdition === "adhoc" &&
          record.meta.sourceCommitEpoch < expected.startEpoch;
        const scheduledBehind = (editionRank[actualEdition] ?? 0) < editionRank[expected.edition];
        const slotBehind = record.info.dataDate === expected.dataDate &&
          (actualEdition === "unknown" || adHocBeforeSlot ||
            (actualEdition !== "adhoc" && scheduledBehind));
        if (!dateBehind && !slotBehind) return "";
        return `报告已过期：应至少为 ${expected.dataDate} ${expected.label}，` +
          `当前为 ${record.info.dataDate} ${record.info.edition}。` +
          "现继续显示最后一份已验证报告，未伪造新数据。";
      };

      const validateMeta = (meta) => {
        if (!meta || meta.schemaVersion !== 1) throw new Error("发布信息版本不兼容");
        if (!/^[0-9a-f]{40}$/i.test(meta.sourceSha || "")) throw new Error("发布来源无效");
        if (!Number.isInteger(meta.sourceCommitEpoch) || meta.sourceCommitEpoch <= 0) {
          throw new Error("发布时间无效");
        }
        if (!/^\d{4}-\d{2}-\d{2}$/.test(meta.dataDate || "")) throw new Error("数据日期无效");
        if (!/^[0-9a-f]{40}$/i.test(meta.htmlBlob || "")) throw new Error("页面指纹无效");
        return meta;
      };

      const protect = (html) => {
        const csp = '<meta http-equiv="Content-Security-Policy" content="default-src &apos;none&apos;; style-src &apos;unsafe-inline&apos;; script-src &apos;none&apos;; img-src &apos;none&apos;; font-src &apos;none&apos;; media-src &apos;none&apos;; connect-src &apos;none&apos;; frame-src &apos;none&apos;; object-src &apos;none&apos;; base-uri &apos;none&apos;; form-action &apos;none&apos;">';
        const protectedHtml = html.replace(/<head[^>]*>/i, (head) => head + csp);
        if (protectedHtml === html) throw new Error("页面缺少安全头");
        return protectedHtml;
      };

      async function verifyPair(bytes, meta) {
        validateMeta(meta);
        let verifiedBytes = bytes;
        let blob = await gitBlobSha(verifiedBytes);
        if (blob.toLowerCase() !== meta.htmlBlob.toLowerCase()) {
          const canonicalBytes = canonicalizeTransportInjection(bytes);
          if (!canonicalBytes) throw new Error("发布信息与页面不是同一版本");
          blob = await gitBlobSha(canonicalBytes);
          if (blob.toLowerCase() !== meta.htmlBlob.toLowerCase()) {
            throw new Error("发布信息与页面不是同一版本");
          }
          verifiedBytes = canonicalBytes;
          console.warn("XUAN-IB removed a transport-injected external script before verification");
        }
        const html = decodeUtf8(verifiedBytes);
        if (!html.includes("xuan-ib-handover:v1") ||
            !approvedTitles.some((title) => html.includes(title))) {
          throw new Error("页面完整性标记不符");
        }
        const info = reportInfo(html);
        if (info.dataDate !== meta.dataDate) throw new Error("发布日期与页面日期不一致");
        return { html, protectedHtml: protect(html), meta, info, blob };
      }

      function requireMonotonic(record, previous) {
        if (!previous) return record;
        if (record.meta.dataDate < previous.meta.dataDate) {
          throw new Error("上游报告日期早于本机已验证版本");
        }
        if (record.meta.dataDate > previous.meta.dataDate) return record;
        if (record.meta.sourceCommitEpoch < previous.meta.sourceCommitEpoch) {
          throw new Error("上游同日报告版本早于本机已验证版本");
        }
        if (record.meta.sourceCommitEpoch === previous.meta.sourceCommitEpoch &&
            record.meta.htmlBlob.toLowerCase() !== previous.meta.htmlBlob.toLowerCase()) {
          throw new Error("同一发布版本出现不同页面指纹");
        }
        return record;
      }

      const statusFor = (record, prefix) =>
        `${prefix} · 报告 ${record.info.dataDate} · ${record.info.edition} · L ${loaderBuild}`;

      function renderVerified(record, prefix, warningMessage = "") {
        frame.srcdoc = record.protectedHtml;
        lastVerified = record;
        warning.hidden = !warningMessage;
        warning.textContent = warningMessage;
        status.classList.toggle("error", Boolean(warningMessage));
        status.textContent = statusFor(record, prefix);
      }

      function saveVerified(record) {
        if (!storage) return;
        try {
          storage.setItem(storageKey, JSON.stringify({
            cacheVersion: 1,
            html: record.html,
            meta: record.meta,
            verifiedAt: Date.now()
          }));
        } catch (error) {
          console.warn("XUAN-IB verified-page backup failed", error);
        }
      }

      async function restoreVerified(request) {
        if (lastVerified || !storage) return Boolean(lastVerified);
        try {
          const raw = storage.getItem(storageKey);
          if (!raw) return false;
          const saved = JSON.parse(raw);
          if (saved.cacheVersion !== 1 || typeof saved.html !== "string") return false;
          const record = await verifyPair(new TextEncoder().encode(saved.html), saved.meta);
          if (request !== requestSequence) return false;
          renderVerified(record, "正在核对最新版", staleMessage(record));
          return true;
        } catch (error) {
          try { storage.removeItem(storageKey); } catch (_) {}
          console.warn("XUAN-IB saved verified page was rejected", error);
          return false;
        }
      }

      async function loadLatest() {
        const request = ++requestSequence;
        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), 10_000);
        lastAttempt = Date.now();
        button.disabled = true;
        warning.hidden = true;
        status.classList.remove("error");
        const restored = await restoreVerified(request);
        if (request !== requestSequence) return;
        if (!restored) status.textContent = "正在读取最新版…";
        try {
          const token = `${loaderBuild}-${Date.now()}`;
          const metaUrl = new URL("latest.meta.json", location.href);
          const htmlUrl = new URL("latest.html", location.href);
          metaUrl.searchParams.set("v", token);
          htmlUrl.searchParams.set("v", token);
          const options = { cache: "no-store", credentials: "omit", signal: controller.signal };
          const [metaResponse, htmlResponse] = await Promise.all([
            fetch(metaUrl, options),
            fetch(htmlUrl, options)
          ]);
          if (!metaResponse.ok) throw new Error(`metadata HTTP ${metaResponse.status}`);
          if (!htmlResponse.ok) throw new Error(`page HTTP ${htmlResponse.status}`);
          const [meta, bytes] = await Promise.all([
            metaResponse.json(),
            htmlResponse.arrayBuffer()
          ]);
          const record = requireMonotonic(
            await verifyPair(new Uint8Array(bytes), meta),
            lastVerified
          );
          if (request !== requestSequence) return;
          renderVerified(record, `已同步 ${clock()}`, staleMessage(record));
          saveVerified(record);
          lastSuccess = Date.now();
          updateAdhocWait(record);
        } catch (error) {
          if (request !== requestSequence) return;
          status.classList.add("error");
          if (lastVerified) {
            const stale = staleMessage(lastVerified);
            const fallback = "上游暂不一致，正在显示上一份已验证版本";
            renderVerified(lastVerified, "显示上一份已验证版本", stale ? `${stale} ${fallback}` : fallback);
          } else {
            warning.hidden = true;
            status.textContent = `暂时无法读取已验证报告 · L ${loaderBuild}`;
            frame.srcdoc = "<!doctype html><meta name=viewport content='width=device-width,initial-scale=1'><style>body{font:16px -apple-system,sans-serif;padding:28px;color:#555}button{font:inherit}</style><p>暂时无法读取最新交接页，请稍后点击上方“刷新”。</p>";
          }
          if (adhocWait && !expireAdhocWait()) showAdhocPending();
          console.warn("XUAN-IB latest-page refresh failed", error);
        } finally {
          window.clearTimeout(timeout);
          if (request === requestSequence) button.disabled = false;
        }
      }

      restoreAdhocWait();
      if (adhocWait) showAdhocPending();
      adhocButton.addEventListener("click", beginAdhocWait);
      button.addEventListener("click", loadLatest);
      window.addEventListener("pageshow", (event) => {
        if (!expireAdhocWait()) return loadLatest();
      });
      window.addEventListener("focus", () => {
        if (adhocWait && !expireAdhocWait()) return loadLatest();
      });
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && adhocWait && !expireAdhocWait()) return loadLatest();
        if (!document.hidden && Date.now() - lastAttempt > 60_000) return loadLatest();
      });
      window.setInterval(() => {
        if (adhocWait && !expireAdhocWait()) return loadLatest();
      }, adhocPollMs);
      window.setInterval(() => {
        if (!document.hidden && Date.now() - lastAttempt > 5 * 60_000) loadLatest();
      }, 60_000);
    })();
  </script>
</body>
</html>
