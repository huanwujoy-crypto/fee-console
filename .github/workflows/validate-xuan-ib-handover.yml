name: Validate XUAN-IB candidate

on:
  push:
    branches:
      - 'claude/**'
    paths:
      - xuan-ib/index.html

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the candidate only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Load the guard from trusted main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          git show origin/main:scripts/handover-guard.mjs > "$RUNNER_TEMP/handover-guard.mjs"
          git show origin/main:scripts/xuan-ib-classification-disclosure.mjs > "$RUNNER_TEMP/xuan-ib-classification-disclosure.mjs"
          git show origin/main:scripts/xuan-ib-cash-plan.mjs > "$RUNNER_TEMP/xuan-ib-cash-plan.mjs"
          git show origin/main:xuan-ib/latest.html > "$RUNNER_TEMP/previous-latest.html"
          git show origin/main:xuan-ib/latest.meta.json > "$RUNNER_TEMP/previous-latest.meta.json"

      - name: Validate the candidate contract
        shell: bash
        run: |
          set -euo pipefail

          head_sha=$(git rev-parse HEAD)
          candidate_parent=$(git rev-parse "HEAD^")
          if ! git merge-base --is-ancestor "$candidate_parent" origin/main ||
             [[ $(git rev-list --count "$candidate_parent..HEAD") -ne 1 ]] ||
             [[ $(git rev-list --count --merges "$candidate_parent..HEAD") -ne 0 ]]; then
            echo 'Candidate must be one non-merge commit based on a trusted main ancestor.' >&2
            exit 1
          fi
          candidate_lag=$(git rev-list --first-parent --count "$candidate_parent..origin/main")
          if (( candidate_lag > 50 )); then
            echo 'Candidate is based on an excessively old main ancestor.' >&2
            exit 1
          fi
          now_epoch=$(date -u +%s)
          current_main=$(git rev-parse origin/main)
          candidate_epoch=$(git show -s --format='%ct' "$head_sha")
          parent_epoch=$(git show -s --format='%ct' "$candidate_parent")
          if (( candidate_epoch < now_epoch - 172800 || candidate_epoch > now_epoch + 300 )); then
            echo 'Candidate commit time is outside the approved 48-hour window.' >&2
            exit 1
          fi
          if [[ "$candidate_parent" != "$current_main" ]] &&
             (( parent_epoch < now_epoch - 604800 )); then
            echo 'Candidate parent is older than the approved seven-day window.' >&2
            exit 1
          fi

          mapfile -t changed_files < <(git diff --name-only "$candidate_parent..HEAD")
          if (( ${#changed_files[@]} != 1 )) || [[ "${changed_files[0]}" != "xuan-ib/index.html" ]]; then
            echo 'Candidate must change xuan-ib/index.html only.' >&2
            exit 1
          fi

          subject=$(git show -s --format='%s' "$head_sha")
          subject_re='^handover ([0-9]{4}-[0-9]{2}-[0-9]{2})$'
          if [[ ! "$subject" =~ $subject_re ]]; then
            echo 'Commit subject must be handover YYYY-MM-DD.' >&2
            exit 1
          fi
          data_date=${BASH_REMATCH[1]}
          today_hkt=$(TZ=Asia/Hong_Kong date +%F)
          yesterday_hkt=$(TZ=Asia/Hong_Kong date -d 'yesterday' +%F)

          previous_data_date=$(jq -er \
            '.dataDate | select(type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))' \
            "$RUNNER_TEMP/previous-latest.meta.json")
          records_update=false
          if grep -Eiq '<!--[[:space:]]*xuan-ib-records-update:v1[[:space:]]*-->' xuan-ib/index.html; then
            records_update=true
          fi
          if [[ "$records_update" == true ]]; then
            if [[ "$data_date" != "$previous_data_date" ]]; then
              echo 'Records-update subject must preserve the trusted previous data date.' >&2
              exit 1
            fi
          elif [[ "$data_date" != "$today_hkt" && "$data_date" != "$yesterday_hkt" ]]; then
            echo 'Ordinary candidate data date is stale or in the future.' >&2
            exit 1
          fi

          previous_source_sha=$(jq -er \
            '.sourceSha | select(type == "string" and test("^[0-9a-f]{40}$"))' \
            "$RUNNER_TEMP/previous-latest.meta.json")
          previous_html_blob=$(jq -er \
            '.htmlBlob | select(type == "string" and test("^[0-9a-f]{40}$"))' \
            "$RUNNER_TEMP/previous-latest.meta.json")
          actual_previous_blob=$(git hash-object "$RUNNER_TEMP/previous-latest.html")
          if [[ "$actual_previous_blob" != "$previous_html_blob" ]]; then
            echo 'Trusted previous HTML does not match latest.meta.json.' >&2
            exit 1
          fi

          XUAN_IB_PREVIOUS_SOURCE_SHA="$previous_source_sha" \
          XUAN_IB_PREVIOUS_HTML_BLOB="$previous_html_blob" \
            node "$RUNNER_TEMP/handover-guard.mjs" \
              xuan-ib/index.html "$data_date" "$RUNNER_TEMP/previous-latest.html"
