name: Lock XUAN-IB publication policy

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy-lock:
    # Draft notices deliberately use a non-required context name. Otherwise a
    # green draft notice could briefly satisfy the required publication lock
    # while the same SHA is being moved to Ready for review.
    name: ${{ github.event.pull_request.draft && 'xuan-ib-policy-lock-draft-notice' || 'xuan-ib-policy-lock' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain deferred enforcement for draft pull requests
        if: ${{ github.event.pull_request.draft == true }}
        shell: bash
        run: |
          echo 'This pull request is still a draft, so it cannot be merged.'
          echo 'The publication lock will run in full when the pull request is marked ready for review.'
          {
            echo '### XUAN-IB publication lock'
            echo ''
            echo ':information_source: Draft pull request — strict enforcement is deferred until **Ready for review**.'
            echo 'No publication permission has been granted.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse pull requests that alter the trusted publication boundary
        if: ${{ github.event.pull_request.draft == false }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_FILE_COUNT: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          files_json="$RUNNER_TEMP/pr-files.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            > "$files_json"
          returned_file_count=$(jq '[.[][]] | length' "$files_json")
          if [[ "$returned_file_count" != "$EXPECTED_FILE_COUNT" ]] ||
             (( returned_file_count > 1000 )); then
            echo 'The pull-request file list is incomplete or exceeds the approved review size.' >&2
            exit 1
          fi
          protected_re='^(\.gitignore$|CLAUDE\.md|\.claude/rules/xuan-ib-handover\.md|claude/xuan-ib-etf-ledger-[^/]+\.json$|claude/(nightly-handover-spec-ADDENDUM-v916|xuan-ib-runtime-contract-v1|xuan-ib-compact-report-v1|xuan-ib-cash-first-plan-v1|xuan-ib-etf-abc-v1|xuan-ib-etf-trend-v2|xuan-ib-report-schedule-HKT-v1|xuan-ib-classification-authority-review-2026-08-31|xuan-ib-mrvl-t1-approval-2026-08-31|xuan-ib-policy-v2-approval-2026-09-01)\.md|claude/(xuan-ib-cash-identities-v1|xuan-ib-ai-tier-overrides-v1|xuan-ib-policy-v2)\.json$|\.github/(CODEOWNERS$|workflows/|actions/)|scripts/(handover-guard|xuan-ib-promotion|xuan-ib-loader|xuan-ib-decision-menu|build-xuan-decision-shortcut|xuan-ib-progress|xuan-ib-classification-audit|xuan-ib-classification-disclosure|xuan-ib-classification-correction|xuan-ib-cash-plan|xuan-ib-cash-plan-correction|xuan-ib-cash-identity|xuan-ib-mrvl-t1|xuan-ib-policy-page|xuan-ib-etf-pane|xuan-ib-etf-abc|xuan-ib-etf-ledger|xuan-ib-etf-ledger-leak-guard|xuan-ib-etf-trend|xuan-ib-etf-trend-envelope|xuan-ib-etf-trend-build|xuan-ib-etf-trend-view|xuan-ib-etf-summary-transport|xuan-ib-report-view|xuan-ib-report-prepare|xuan-ib-report-prepare-safety|xuan-ib-run-clock|xuan-ib-run-manifest|xuan-ib-report-schedule|xuan-ib-publish-health)\.(mjs|test\.mjs)$|xuan-ib/)'
          protected_re="${protected_re}|^scripts/(xuan-ib-git-identity-preflight|xuan-ib-source-adapter|xuan-ib-manual-consent|xuan-ib-manual-consent-integration|xuan-ib-order-view)\.(mjs|test\.mjs)$"
          if jq -r '.[][] | .filename, (.previous_filename // empty)' "$files_json" |
             grep -Eq "$protected_re"; then
            head_sha='${{ github.event.pull_request.head.sha }}'
            approval_line="/approve-xuan-ib-maintenance $head_sha"
            comments_json="$RUNNER_TEMP/pr-comments.json"
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
              > "$comments_json"
            approval_count=$(jq --arg approval_line "$approval_line" '
              [
                .[][]
                | select(.author_association == "OWNER")
                | select(
                    (.body
                      | split("\n")
                      | map(gsub("^[[:space:]]+|[[:space:]]+$"; ""))
                      | index($approval_line)
                    ) != null
                  )
              ]
              | length
            ' "$comments_json")
            if (( approval_count > 0 )); then
              echo "Repository-owner maintenance approval matches the exact head SHA: $head_sha"
              exit 0
            fi
            echo 'This PR changes the locked XUAN-IB publication boundary.' >&2
            echo 'For an intentional maintenance PR, keep it in draft, add this exact OWNER comment, then mark it ready:' >&2
            echo "$approval_line" >&2
            echo 'The approval is invalidated automatically by every new commit.' >&2
            exit 1
          fi
          echo 'The PR does not alter the XUAN-IB publication boundary.'
