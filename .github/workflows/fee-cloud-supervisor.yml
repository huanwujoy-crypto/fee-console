name: Fee cloud deterministic supervisor

on:
  workflow_run:
    workflows:
      - Fee console cloud producer
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: fee-cloud-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    # Ratio-only and the fixed read-only diagnostic are not fee production.
    if: ${{ github.event.workflow_run.display_title != 'Manual ratio snapshot' && !(github.event.workflow_run.display_title == 'IB diagnostic 2026-11-04' && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.path == '.github/workflows/fee-cloud-producer.yml' && github.event.workflow_run.actor.id == 283054367 && github.event.workflow_run.run_attempt == 1) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false

      - name: Maintain the amount-free Codex repair candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/fee-cloud-supervisor.mjs
