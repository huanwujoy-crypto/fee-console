name: Promote fee-console data

on:
  push:
    branches:
      - 'claude/*'

permissions:
  contents: write

concurrency:
  group: promote-fee-data
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the routine branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and fast-forward main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^claude/[a-z0-9-]+-[a-z0-9]{6}$ ]]; then
            echo "Refusing unexpected branch: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "Routine branch is not a descendant of origin/main" >&2
            exit 1
          fi

          mapfile -t changed_files < <(git diff --name-only origin/main..HEAD)
          if (( ${#changed_files[@]} == 0 )); then
            echo "No file changes; branch authorization probe succeeded."
            exit 0
          fi
          if (( ${#changed_files[@]} != 1 )) || [[ "${changed_files[0]}" != "data.json" ]]; then
            echo "Only data.json may be promoted to main" >&2
            printf '%s\n' "${changed_files[@]}" >&2
            exit 1
          fi

          while IFS=$'\t' read -r author_email committer_email subject; do
            if [[ "$author_email" != "noreply@anthropic.com" ]] || [[ "$committer_email" != "noreply@anthropic.com" ]]; then
              echo "Unexpected commit identity: $author_email / $committer_email" >&2
              exit 1
            fi
            if [[ ! "$subject" =~ ^daily\ [0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "Unexpected commit subject: $subject" >&2
              exit 1
            fi
          done < <(git log --format='%ae%x09%ce%x09%s' origin/main..HEAD)

          for commit_sha in $(git rev-list origin/main..HEAD); do
            read -r verified author_login committer_login < <(
              curl --fail --silent --show-error -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$commit_sha" |
                jq -r '[.commit.verification.verified, .author.login, .committer.login] | @tsv'
            )
            if [[ "$verified" != "true" ]] || [[ "$author_login" != "claude" ]] || [[ "$committer_login" != "claude" ]]; then
              echo "Commit $commit_sha is not a verified Claude commit" >&2
              exit 1
            fi
          done

          size_bytes=$(wc -c < data.json)
          if (( size_bytes >= 2097152 )); then
            echo "data.json exceeds the 2 MiB limit" >&2
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');
          const outer = JSON.parse(fs.readFileSync('data.json', 'utf8'));
          if (!outer || typeof outer !== 'object' || Array.isArray(outer)) {
            throw new Error('data.json must be a JSON object');
          }
          if (outer.enc !== true || outer.v !== 3) {
            throw new Error('data.json must use the encrypted v3 envelope');
          }
          if (typeof outer.data !== 'string' || outer.data.length < 40 || outer.data.length % 4 !== 0) {
            throw new Error('data.json ciphertext has an invalid length');
          }
          if (!/^[A-Za-z0-9+/]+={0,2}$/.test(outer.data)) {
            throw new Error('data.json ciphertext is not standard base64');
          }
          NODE

          git push origin HEAD:main
