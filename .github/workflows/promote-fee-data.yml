name: Promote fee-console data

# This workflow deliberately runs only from the trusted default branch.
# Codex prepares data on a codex/fee-daily-* branch; it never receives the deploy key.
on:
  # Primary path: every no-secret candidate validation wakes this trusted
  # default-branch workflow immediately. The promotion job still performs its
  # full independent provenance and envelope validation before using the key.
  workflow_run:
    workflows:
      - Validate fee-console data candidate
    types:
      - completed
    branches:
      - 'codex/fee-daily-*'
  schedule:
    # Independent daily watchdog, HKT10:45/13:15/14:15. Candidate promotion
    # keeps its separate signature, exact base, fresh-health and envelope gates.
    - cron: '45 2 * * *'
    - cron: '15 5,6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promote-fee-data
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      ${{ (github.event_name != 'schedule' || vars.FEE_REPORT_PERIODS_ENABLED == 'true') &&
          (github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push')) }}
    runs-on: ubuntu-latest
    environment: trusted-promotion
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out trusted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.PROMOTE_MAIN_DEPLOY_KEY }}

      - name: Restrict one-off promotion to its recorded candidate
        id: once
        if: ${{ vars.FEE_REPORT_ONCE_MAIN != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FEE_REPORT_ONCE_MAIN: ${{ vars.FEE_REPORT_ONCE_MAIN }}
        run: node scripts/fee-report-producer.mjs --mode=once-promotion

      - name: Fetch Codex daily branches
        if: ${{ vars.FEE_REPORT_ONCE_MAIN == '' || steps.once.outputs.state == 'candidate' }}
        shell: bash
        run: git fetch --no-tags --prune origin '+refs/heads/codex/fee-daily-*:refs/remotes/origin/codex/fee-daily-*'

      - name: Select one fresh, verified data update
        id: candidate
        if: ${{ vars.FEE_REPORT_ONCE_MAIN == '' || steps.once.outputs.state == 'candidate' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FEE_REPORT_MARKETS: ${{ vars.FEE_REPORT_MARKETS }}
          ONCE_CANDIDATE_SHA: ${{ steps.once.outputs.candidate }}
        run: |
          set -euo pipefail

          base_sha=$(git rev-parse origin/main)
          cutoff_epoch=$(date -u -d '36 hours ago' +%s)
          today_utc=$(date -u +%F)
          yesterday_utc=$(date -u -d 'yesterday' +%F)
          candidates=()
          recent_unpromoted_candidate=false

          while IFS= read -r candidate_ref; do
            if [[ -n "${ONCE_CANDIDATE_SHA:-}" && $(git rev-parse "$candidate_ref") != "$ONCE_CANDIDATE_SHA" ]]; then
              continue
            fi
            branch_name=${candidate_ref#origin/}
            # A rejected recent outstanding candidate is an anomaly, even off-day.
            # Already promoted branches and old abandoned branches do not count.
            if ! git merge-base --is-ancestor "$candidate_ref" origin/main &&
               (( $(git show -s --format='%ct' "$candidate_ref") >= cutoff_epoch )); then
              recent_unpromoted_candidate=true
            fi

            if [[ ! "$branch_name" =~ ^codex/fee-daily-([0-9]{8})-[a-z0-9]{6}$ ]]; then
              continue
            fi
            branch_date=${BASH_REMATCH[1]}

            if ! git merge-base --is-ancestor origin/main "$candidate_ref"; then
              continue
            fi
            if [[ $(git rev-list --count "origin/main..$candidate_ref") -ne 1 ]]; then
              continue
            fi
            if [[ $(git rev-parse "$candidate_ref^") != "$base_sha" ]]; then
              continue
            fi

            mapfile -t changed_files < <(git diff --name-only "origin/main..$candidate_ref")
            if (( ${#changed_files[@]} < 1 || ${#changed_files[@]} > 2 )) ||
               [[ ! " ${changed_files[*]} " =~ " fee-data-health.json " ]] ||
               printf '%s\n' "${changed_files[@]}" | grep -Evqx 'data\.json|fee-data-health\.json'; then
              continue
            fi
            if [[ $(git rev-list --count --merges "origin/main..$candidate_ref") -ne 0 ]]; then
              continue
            fi

            candidate_sha=$(git rev-parse "$candidate_ref")
            subject=$(git show -s --format='%s' "$candidate_sha")
            if [[ ! "$subject" =~ ^daily\ ([0-9]{4}-[0-9]{2}-[0-9]{2})$ ]]; then
              continue
            fi
            data_date=${BASH_REMATCH[1]}
            if [[ "$branch_date" != "${data_date//-/}" ]]; then
              continue
            fi
            health_date=$(git show "$candidate_ref:fee-data-health.json" | jq -r '.targetDate // empty')
            if [[ "$health_date" != "$data_date" ]]; then
              continue
            fi
            target_epoch=$(date -u -d "$data_date" +%s)
            today_epoch=$(date -u -d "$today_utc" +%s)
            target_age_days=$(( (today_epoch - target_epoch) / 86400 ))
            if (( target_age_days < 0 || target_age_days > 4 )); then
              continue
            fi

            commit_epoch=$(git show -s --format='%ct' "$candidate_sha")
            if (( commit_epoch < cutoff_epoch )); then
              continue
            fi

            read -r verified author_login committer_login < <(
              curl --fail --silent --show-error \
                -H 'Accept: application/vnd.github+json' \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$candidate_sha" |
                jq -r '[.commit.verification.verified, .author.login, .committer.login] | @tsv'
            )
            if [[ "$verified" != "true" ]] ||
               [[ "$author_login" != "huanwujoy-crypto" ]] ||
               [[ "$committer_login" != "huanwujoy-crypto" && "$committer_login" != "web-flow" ]]; then
              continue
            fi

            git show "$candidate_ref:data.json" > "$RUNNER_TEMP/candidate-data.json"
            git show "$candidate_ref:fee-data-health.json" > "$RUNNER_TEMP/candidate-health.json"
            size_bytes=$(wc -c < "$RUNNER_TEMP/candidate-data.json")
            if (( size_bytes >= 2097152 )); then
              continue
            fi
            if ! node - "$RUNNER_TEMP/candidate-data.json" <<'NODE'
          const fs = require('fs');
          const file = process.argv[2];
          const outer = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (!outer || typeof outer !== 'object' || Array.isArray(outer)) {
            throw new Error('data.json must be a JSON object');
          }
          if (outer.enc !== true || outer.v !== 3) {
            throw new Error('data.json must use the encrypted v3 envelope');
          }
          if (typeof outer.data !== 'string' || outer.data.length < 40 || outer.data.length % 4 !== 0) {
            throw new Error('data.json ciphertext has an invalid length');
          }
          if (!/^[A-Za-z0-9+/]+={0,2}$/.test(outer.data)) {
            throw new Error('data.json ciphertext is not standard base64');
          }
          if (Buffer.from(outer.data, 'base64').toString('base64') !== outer.data) {
            throw new Error('data.json ciphertext is not canonical base64');
          }
          NODE
            then
              continue
            fi

            if ! node scripts/fee-data-health.mjs validate \
              --health="$RUNNER_TEMP/candidate-health.json" \
              --data="$RUNNER_TEMP/candidate-data.json"; then
              continue
            fi
            outcome=$(jq -r '.outcome' "$RUNNER_TEMP/candidate-health.json")
            data_changed=false
            printf '%s\n' "${changed_files[@]}" | grep -qx 'data.json' && data_changed=true
            if [[ "$outcome" == 'updated' && "$data_changed" != true ]] ||
               [[ "$outcome" == 'no-op' && "$data_changed" != false ]] ||
               [[ "$outcome" != 'updated' && "$outcome" != 'no-op' ]]; then
              continue
            fi

            candidates+=("$candidate_ref")
          done < <(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/codex/fee-daily-*')

          if (( ${#candidates[@]} == 0 )); then
            # Weekly/monthly published coverage is checked against its frozen
            # cycle. This does not relax fresh candidate health or target age.
            if [[ "$GITHUB_EVENT_NAME" == 'schedule' ]]; then
              if [[ "$recent_unpromoted_candidate" == true ]] || [[ ! -f fee-data-health.json ]]; then
                echo 'Period watch refused: outstanding candidate or missing receipt.' >&2
                exit 1
              fi
              node scripts/fee-report-producer.mjs --mode=watch --main-sha="$base_sha"
              echo 'sha=' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ -f fee-data-health.json ]]; then
              checked_hkt=$(TZ=Asia/Hong_Kong date -d "$(jq -r '.checkedAt // empty' fee-data-health.json)" +%F 2>/dev/null || true)
              today_hkt=$(TZ=Asia/Hong_Kong date +%F)
              if [[ "$checked_hkt" == "$today_hkt" ]] &&
                 node scripts/fee-data-health.mjs validate --health=fee-data-health.json --data=data.json; then
                echo 'Today already has a verified producer receipt; no candidate remains.'
                echo 'sha=' >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            echo 'No verified Codex fee-data producer receipt exists for today.' >&2
            exit 1
          fi
          if (( ${#candidates[@]} != 1 )); then
            echo 'Refusing ambiguous promotion; multiple valid Routine branches are waiting:' >&2
            printf '  %s\n' "${candidates[@]}" >&2
            exit 1
          fi

          candidate_sha=$(git rev-parse "${candidates[0]}")
          echo "Selected ${candidates[0]} at $candidate_sha"
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Fast-forward main with the dedicated deploy key
        if: steps.candidate.outputs.sha != ''
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          EXPECTED_BASE_SHA: ${{ steps.candidate.outputs.base_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [[ $(git rev-parse origin/main) != "$EXPECTED_BASE_SHA" ]]; then
            echo 'main changed after validation; refusing promotion' >&2
            exit 1
          fi
          git push origin "$CANDIDATE_SHA:refs/heads/main"

  once-cleanup:
    needs: promote
    if: ${{ always() && vars.FEE_REPORT_ONCE_MAIN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ vars.FEE_REPORT_ONCE_MAIN }}
          persist-credentials: false
      - name: Pause the two workflows after terminal outcome or expiry
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FEE_REPORT_ONCE_MAIN: ${{ vars.FEE_REPORT_ONCE_MAIN }}
          ONCE_PROMOTE_RESULT: ${{ needs.promote.result }}
          ONCE_EVENT_HEAD: ${{ github.event.workflow_run.head_sha }}
          ONCE_EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: node scripts/fee-report-producer.mjs --mode=once-cleanup
