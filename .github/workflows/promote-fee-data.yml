# Minimal-privilege bridge that promotes the daily data.json from the Routine's
# dedicated output branch onto main. Claude's Routines cannot push main directly,
# so this workflow does it — but only for a commit series that provably contains
# nothing except a well-formed daily data.json update.
#
# No PAT, no repository secret, no third-party action: it runs on the built-in
# GITHUB_TOKEN scoped to contents:write, and the only non-local action used is
# GitHub's own actions/checkout.
name: Promote fee data to main

on:
  push:
    branches:
      # Exact branch, not a glob. Nothing else can start this workflow.
      - claude/focused-heisenberg

permissions:
  contents: write

concurrency:
  # Serialize promotions; never cancel one mid-push.
  group: promote-fee-data
  cancel-in-progress: false

jobs:
  promote:
    name: Validate and promote
    runs-on: ubuntu-latest
    # Defence in depth: the trigger already pins the branch, this pins it again.
    if: github.ref == 'refs/heads/claude/focused-heisenberg'
    env:
      PROMOTE_BRANCH: claude/focused-heisenberg
      BASE_BRANCH: main
      DATA_FILE: data.json
      ALLOWED_AUTHOR_EMAIL: noreply@anthropic.com
      SUBJECT_PATTERN: '^daily [0-9]{4}-[0-9]{2}-[0-9]{2}$'
      MAX_DATA_BYTES: '2097152'

    steps:
      - name: Check out the promotion branch
        uses: actions/checkout@v4
        with:
          ref: claude/focused-heisenberg
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"
          echo "pushed sha      : ${GITHUB_SHA}"
          echo "checked-out head: $(git rev-parse HEAD)"
          echo "origin/${BASE_BRANCH}     : $(git rev-parse "origin/${BASE_BRANCH}")"

      - name: Require origin/main to be an ancestor of HEAD
        shell: bash
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "origin/${BASE_BRANCH}" HEAD; then
            echo "::error::origin/${BASE_BRANCH} is not an ancestor of HEAD — the branch is behind or has diverged. Rebase it onto ${BASE_BRANCH}; this workflow never force-pushes."
            exit 1
          fi
          echo "origin/${BASE_BRANCH} is an ancestor of HEAD — fast-forward is possible."

      - name: Decide whether there is anything to promote
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "origin/${BASE_BRANCH}..HEAD")"
          if [ -z "${changed}" ]; then
            # Authorization probe: the branch exists at (or reduces to) main's tree.
            # Nothing to do, and main must not move.
            echo "No file changes in origin/${BASE_BRANCH}..HEAD — authorization probe only, leaving ${BASE_BRANCH} untouched."
            echo "promote=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "Changed files:"
          printf '%s\n' "${changed}" | sed 's/^/  /'
          if [ "${changed}" != "${DATA_FILE}" ]; then
            echo "::error::Only ${DATA_FILE} may be promoted to ${BASE_BRANCH}, but this range changes other paths. Refusing."
            exit 1
          fi
          echo "promote=true" >> "${GITHUB_OUTPUT}"

      - name: Audit every commit in the range
        if: steps.scope.outputs.promote == 'true'
        shell: bash
        run: |
          set -euo pipefail
          range="origin/${BASE_BRANCH}..HEAD"
          count="$(git rev-list --count "${range}")"
          if [ "${count}" -eq 0 ]; then
            echo "::error::No commits in ${range} but files differ — refusing."
            exit 1
          fi
          echo "Auditing ${count} commit(s)."
          fail=0
          while IFS=$'\x1f' read -r sha email subject; do
            [ -n "${sha}" ] || continue
            if [ "${email}" != "${ALLOWED_AUTHOR_EMAIL}" ]; then
              echo "::error::${sha} author email is not ${ALLOWED_AUTHOR_EMAIL}."
              fail=1
            fi
            if ! printf '%s' "${subject}" | grep -Eq "${SUBJECT_PATTERN}"; then
              echo "::error::${sha} subject does not match ${SUBJECT_PATTERN}."
              fail=1
            fi
            echo "  ${sha} ok"
          done < <(git log --no-merges --format="%H%x1f%ae%x1f%s" "${range}")
          if [ "$(git rev-list --count --merges "${range}")" -ne 0 ]; then
            echo "::error::Merge commits are not allowed in ${range}."
            fail=1
          fi
          [ "${fail}" -eq 0 ] || exit 1
          echo "All commits are authored by ${ALLOWED_AUTHOR_EMAIL} with a well-formed daily subject."

      - name: Validate data.json
        if: steps.scope.outputs.promote == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const file = process.env.DATA_FILE;
          const max = Number(process.env.MAX_DATA_BYTES);
          const fail = m => { console.log(`::error::${file}: ${m}`); process.exit(1); };

          const st = fs.statSync(file);
          if (!st.isFile()) fail("not a regular file");
          if (!(st.size < max)) fail(`is ${st.size} bytes, which is not smaller than the ${max}-byte limit`);

          let outer;
          try { outer = JSON.parse(fs.readFileSync(file, "utf8")); }
          catch (e) { fail("is not valid JSON"); }
          if (outer === null || typeof outer !== "object" || Array.isArray(outer)) fail("is not a JSON object");
          if (outer.enc !== true) fail("enc is not exactly true");
          if (outer.v !== 3) fail("v is not exactly 3");
          if (typeof outer.data !== "string") fail("data is not a string");

          const b64 = outer.data;
          if (b64.length % 4 !== 0 || !/^[A-Za-z0-9+/]+={0,2}$/.test(b64)) fail("data is not a base64 string");
          const buf = Buffer.from(b64, "base64");
          if (buf.toString("base64") !== b64) fail("data is not canonical base64");
          // AES-256-GCM v3 envelope: 12-byte IV + ciphertext + 16-byte tag.
          if (buf.length < 29) fail(`data decodes to ${buf.length} bytes, too short for a v3 envelope`);
          if (buf.length >= max) fail(`data decodes to ${buf.length} bytes, over the limit`);

          console.log(`${file} ok: ${st.size} bytes on disk, v3 envelope of ${buf.length} bytes.`);
          NODE

      - name: Promote to main
        if: steps.scope.outputs.promote == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Plain fast-forward push. No --force, no --force-with-lease: if main has
          # moved, this fails and a human decides what to do.
          git push origin "HEAD:refs/heads/${BASE_BRANCH}"
          echo "Promoted $(git rev-parse HEAD) to ${BASE_BRANCH}."
