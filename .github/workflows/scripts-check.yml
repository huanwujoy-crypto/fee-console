name: Validate fee-console scripts

# scripts/ holds the only code that writes data.json. Every change to it must
# keep the blocking rules in docs/daily-data-contract.md provably intact.

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  scripts-check:
    # Keep the draft notice separate from the required scripts-check context.
    # The required name appears only when full validation is actually running.
    name: ${{ github.event.pull_request.draft && 'scripts-check-draft-notice' || 'scripts-check' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain deferred validation for draft pull requests
        if: ${{ github.event.pull_request.draft == true }}
        shell: bash
        run: |
          echo 'This pull request is still a draft, so it cannot be merged.'
          echo 'The complete script suite will run when the pull request is marked ready for review.'
          {
            echo '### fee-console script validation'
            echo ''
            echo ':information_source: Draft pull request — full validation is deferred until **Ready for review**.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the proposed merge
        if: ${{ github.event.pull_request.draft == false }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Reject private ETF ledger artifacts
        if: ${{ github.event.pull_request.draft == false }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/xuan-ib-etf-ledger-leak-guard.mjs "$BASE_SHA"

      - name: Verify append-only implementation progress
        if: ${{ github.event.pull_request.draft == false }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/xuan-ib-progress.mjs "$BASE_SHA"

      - name: Test implementation progress and classification audit
        if: ${{ github.event.pull_request.draft == false }}
        run: node --test scripts/xuan-ib-progress.test.mjs scripts/xuan-ib-classification-audit.test.mjs scripts/xuan-ib-classification-disclosure.test.mjs scripts/xuan-ib-classification-correction.test.mjs scripts/xuan-ib-cash-plan.test.mjs scripts/xuan-ib-cash-plan-correction.test.mjs scripts/xuan-ib-cash-identity.test.mjs scripts/xuan-ib-mrvl-t1.test.mjs scripts/xuan-ib-policy-page.test.mjs scripts/xuan-ib-etf-pane.test.mjs scripts/xuan-ib-etf-abc.test.mjs scripts/xuan-ib-etf-ledger.test.mjs scripts/xuan-ib-etf-ledger-leak-guard.test.mjs scripts/xuan-ib-etf-trend.test.mjs scripts/xuan-ib-etf-trend-envelope.test.mjs scripts/xuan-ib-etf-trend-build.test.mjs scripts/xuan-ib-etf-trend-view.test.mjs scripts/xuan-ib-etf-summary-transport.test.mjs

      - name: Test compact pilot source identity and display hardening
        if: ${{ github.event.pull_request.draft == false }}
        run: node --test scripts/xuan-ib-git-identity-preflight.test.mjs scripts/xuan-ib-source-adapter.test.mjs scripts/xuan-ib-manual-consent.test.mjs scripts/xuan-ib-manual-consent-integration.test.mjs scripts/xuan-ib-order-view.test.mjs

      - name: Test inactive account-association pilot and independent publication gates
        if: ${{ github.event.pull_request.draft == false }}
        run: node --test scripts/xuan-ib-account-association.test.mjs scripts/xuan-ib-account-association-publication.test.mjs scripts/xuan-ib-association-sources.test.mjs scripts/xuan-ib-account-association-integration.test.mjs

      - name: Test private source capture and deterministic minimal preparation
        if: ${{ github.event.pull_request.draft == false }}
        run: node --test scripts/xuan-ib-source-capture.test.mjs scripts/xuan-ib-hook-response.test.mjs scripts/xuan-ib-source-hook.test.mjs scripts/xuan-ib-minimal-report.test.mjs scripts/xuan-ib-minimal-prepare.test.mjs

      - name: Run the script test suite
        if: ${{ github.event.pull_request.draft == false }}
        shell: bash
        run: node --test scripts/daily.test.mjs scripts/fee-receipt-core.test.mjs scripts/fee-receipt-ui-contract.test.mjs scripts/fee-ledger-edit-guard.test.mjs scripts/fee-econ-v3-copy.test.mjs scripts/benchmark-cache.test.mjs scripts/ui-pr-guard.test.mjs scripts/ui-flows.test.mjs scripts/handover-guard.test.mjs scripts/xuan-ib-loader.test.mjs scripts/xuan-ib-decision-menu.test.mjs scripts/build-xuan-decision-shortcut.test.mjs scripts/xuan-ib-report-view.test.mjs scripts/xuan-ib-report-prepare-safety.test.mjs scripts/xuan-ib-run-clock.test.mjs scripts/xuan-ib-run-manifest.test.mjs scripts/xuan-ib-promotion.test.mjs scripts/xuan-ib-publish-health.test.mjs scripts/backfill-benchmark.test.mjs scripts/returns.test.mjs
