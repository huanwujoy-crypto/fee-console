name: Promote XUAN-IB handover

on:
  schedule:
    - cron: '5,20,35,50 13 * * 1-5'
    - cron: '5 14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promote-xuan-ib-handover
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: trusted-promotion
    steps:
      - name: Check out trusted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.PROMOTE_MAIN_DEPLOY_KEY }}

      - name: Fetch Claude branches
        shell: bash
        run: git fetch --no-tags --prune origin '+refs/heads/claude/*:refs/remotes/origin/claude/*'

      - name: Select one fresh verified handover
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          base_sha=$(git rev-parse origin/main)
          cutoff_epoch=$(date -u -d '18 hours ago' +%s)
          today_hkt=$(TZ=Asia/Hong_Kong date +%F)
          yesterday_hkt=$(TZ=Asia/Hong_Kong date -d 'yesterday' +%F)
          candidates=()

          while IFS= read -r candidate_ref; do
            branch_name=${candidate_ref#origin/}
            if [[ ! "$branch_name" =~ ^claude/[a-z0-9-]+-[a-z0-9]{6}$ ]]; then
              continue
            fi
            if ! git merge-base --is-ancestor origin/main "$candidate_ref"; then
              continue
            fi
            if [[ $(git rev-list --count "origin/main..$candidate_ref") -ne 1 ]]; then
              continue
            fi
            if [[ $(git rev-parse "$candidate_ref^") != "$base_sha" ]]; then
              continue
            fi

            mapfile -t changed_files < <(git diff --name-only "origin/main..$candidate_ref")
            if (( ${#changed_files[@]} != 1 )) || [[ "${changed_files[0]}" != "xuan-ib/index.html" ]]; then
              continue
            fi
            if [[ $(git rev-list --count --merges "origin/main..$candidate_ref") -ne 0 ]]; then
              continue
            fi

            candidate_sha=$(git rev-parse "$candidate_ref")
            IFS=$'\t' read -r author_email committer_email subject < <(
              git show -s --format='%ae%x09%ce%x09%s' "$candidate_sha"
            )
            if [[ "$author_email" != "noreply@anthropic.com" ]] ||
               [[ "$committer_email" != "noreply@anthropic.com" ]]; then
              continue
            fi
            if [[ ! "$subject" =~ ^handover\ ([0-9]{4}-[0-9]{2}-[0-9]{2})$ ]]; then
              continue
            fi
            data_date=${BASH_REMATCH[1]}
            if [[ "$data_date" != "$today_hkt" && "$data_date" != "$yesterday_hkt" ]]; then
              continue
            fi

            commit_epoch=$(git show -s --format='%ct' "$candidate_sha")
            if (( commit_epoch < cutoff_epoch )); then
              continue
            fi

            IFS=$'\t' read -r verified author_login committer_login < <(
              curl --fail --silent --show-error \
                -H 'Accept: application/vnd.github+json' \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$candidate_sha" |
                jq -r '[.commit.verification.verified, .author.login, .committer.login] | @tsv'
            )
            if [[ "$verified" != "true" ]] ||
               [[ "$author_login" != "claude" ]] ||
               [[ "$committer_login" != "claude" ]]; then
              continue
            fi

            git show "$candidate_ref:xuan-ib/index.html" > "$RUNNER_TEMP/handover.html"
            node scripts/handover-guard.mjs "$RUNNER_TEMP/handover.html" "$data_date"
            candidates+=("$candidate_ref")
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin/claude/)

          if (( ${#candidates[@]} == 0 )); then
            echo 'No fresh handover is waiting; nothing to promote.'
            echo 'sha=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if (( ${#candidates[@]} != 1 )); then
            echo 'Refusing ambiguous promotion; multiple valid handovers are waiting:' >&2
            printf '  %s\n' "${candidates[@]}" >&2
            exit 1
          fi

          candidate_sha=$(git rev-parse "${candidates[0]}")
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Fast-forward main
        if: steps.candidate.outputs.sha != ''
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          EXPECTED_BASE_SHA: ${{ steps.candidate.outputs.base_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [[ $(git rev-parse origin/main) != "$EXPECTED_BASE_SHA" ]]; then
            echo 'main changed after validation; refusing promotion' >&2
            exit 1
          fi
          git push origin "$CANDIDATE_SHA:refs/heads/main"
