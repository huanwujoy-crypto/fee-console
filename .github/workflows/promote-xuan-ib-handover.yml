name: Promote XUAN-IB handover

on:
  workflow_run:
    workflows:
      - Validate XUAN-IB candidate
    types:
      - completed
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promote-xuan-ib-handover
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: trusted-promotion
    steps:
      - name: Check out trusted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.PROMOTE_MAIN_DEPLOY_KEY }}

      - name: Fetch Claude branches
        shell: bash
        run: git fetch --no-tags --prune origin '+refs/heads/claude/*:refs/remotes/origin/claude/*'

      - name: Select the newest fresh verified handover
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          base_sha=$(git rev-parse origin/main)
          published_blob=$(git rev-parse origin/main:xuan-ib/latest.html)
          meta_source_sha=$(jq -r '.sourceSha' xuan-ib/latest.meta.json)
          source_commit_json=$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$meta_source_sha")
          IFS=$'\t' read -r source_verified source_author source_committer source_date source_subject < <(
            jq -r '[.commit.verification.verified, .author.login, .committer.login, .commit.committer.date, (.commit.message | split("\n")[0])] | @tsv' \
              <<< "$source_commit_json"
          )
          if [[ "$source_verified" != "true" ]] ||
             [[ "$source_author" != "claude" ]] ||
             [[ "$source_committer" != "claude" ]]; then
            echo 'Published metadata source is not a verified Claude commit.' >&2
            exit 1
          fi
          source_subject_re='^handover ([0-9]{4}-[0-9]{2}-[0-9]{2})$'
          if [[ ! "$source_subject" =~ $source_subject_re ]]; then
            echo 'Published metadata source has an invalid handover subject.' >&2
            exit 1
          fi
          source_data_date=${BASH_REMATCH[1]}
          source_epoch=$(date -u -d "$source_date" +%s)
          source_blob=$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/xuan-ib/index.html?ref=$meta_source_sha" |
            jq -r '.sha')
          node scripts/xuan-ib-promotion.mjs validate-meta \
            xuan-ib/latest.meta.json "$published_blob" \
            "$meta_source_sha" "$source_epoch" "$source_blob" "$source_data_date"
          published_source_tag="refs/tags/xuan-ib-published/${source_data_date}-${meta_source_sha:0:12}"
          remote_source_sha=$(git ls-remote origin "$published_source_tag" | awk '{print $1}')
          if [[ -z "$remote_source_sha" ]]; then
            if ! git cat-file -e "$meta_source_sha^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$meta_source_sha"
            fi
            git push origin "$meta_source_sha:$published_source_tag"
          elif [[ "$remote_source_sha" != "$meta_source_sha" ]]; then
            echo 'The immutable published-source tag points at another commit.' >&2
            exit 1
          fi
          today_hkt=$(TZ=Asia/Hong_Kong date +%F)
          yesterday_hkt=$(TZ=Asia/Hong_Kong date -d 'yesterday' +%F)
          now_epoch=$(date -u +%s)
          future_cutoff_epoch=$(date -u -d '5 minutes' +%s)
          candidates_file="$RUNNER_TEMP/candidates.json"
          selected_file="$RUNNER_TEMP/selected.json"
          printf '[]\n' > "$candidates_file"

          while IFS= read -r candidate_ref; do
            branch_name=${candidate_ref#origin/}
            branch_re='^claude/[a-z0-9-]+-[a-z0-9]{6}$'
            if [[ ! "$branch_name" =~ $branch_re ]]; then
              continue
            fi
            if ! candidate_parent=$(git rev-parse "$candidate_ref^" 2>/dev/null); then
              echo "Skipping $branch_name: its parent commit cannot be resolved."
              continue
            fi
            if ! git merge-base --is-ancestor "$candidate_parent" origin/main; then
              continue
            fi
            if ! candidate_lag=$(git rev-list --first-parent --count "$candidate_parent..origin/main"); then
              echo "Skipping $branch_name: its distance from main cannot be measured."
              continue
            fi
            if (( candidate_lag > 50 )); then
              continue
            fi
            if ! parent_epoch=$(git show -s --format='%ct' "$candidate_parent"); then
              echo "Skipping $branch_name: its parent timestamp cannot be read."
              continue
            fi
            if [[ "$candidate_parent" != "$base_sha" ]] &&
               (( parent_epoch < now_epoch - 604800 )); then
              continue
            fi
            if ! candidate_commit_count=$(git rev-list --count "$candidate_parent..$candidate_ref"); then
              echo "Skipping $branch_name: its commit range cannot be read."
              continue
            fi
            if [[ "$candidate_commit_count" -ne 1 ]]; then
              continue
            fi

            if ! changed_files_text=$(git diff --name-only "$candidate_parent..$candidate_ref"); then
              echo "Skipping $branch_name: its changed-file list cannot be read."
              continue
            fi
            mapfile -t changed_files < <(printf '%s' "$changed_files_text")
            if (( ${#changed_files[@]} != 1 )) || [[ "${changed_files[0]}" != "xuan-ib/index.html" ]]; then
              continue
            fi
            if ! candidate_merge_count=$(git rev-list --count --merges "$candidate_parent..$candidate_ref"); then
              echo "Skipping $branch_name: its merge history cannot be read."
              continue
            fi
            if [[ "$candidate_merge_count" -ne 0 ]]; then
              continue
            fi

            if ! candidate_blob=$(git rev-parse "$candidate_ref:xuan-ib/index.html" 2>/dev/null); then
              echo "Skipping $branch_name: xuan-ib/index.html is missing or unreadable."
              continue
            fi
            if [[ "$candidate_blob" == "$published_blob" ]]; then
              continue
            fi
            previously_published=false
            while IFS= read -r published_commit; do
              historical_blob=$(git rev-parse "$published_commit:xuan-ib/latest.html" 2>/dev/null || true)
              if [[ "$candidate_blob" == "$historical_blob" ]]; then
                previously_published=true
                break
              fi
            done < <(git rev-list origin/main -- xuan-ib/latest.html)
            if [[ "$previously_published" == true ]]; then
              continue
            fi

            if ! candidate_sha=$(git rev-parse "$candidate_ref" 2>/dev/null); then
              echo "Skipping $branch_name: its commit cannot be resolved."
              continue
            fi
            if ! identity_line=$(git show -s --format='%ae%x09%ce%x09%s' "$candidate_sha"); then
              echo "Skipping $branch_name: its commit identity cannot be read."
              continue
            fi
            IFS=$'\t' read -r author_email committer_email subject <<< "$identity_line"
            if [[ "$author_email" != "noreply@anthropic.com" ]] ||
               [[ "$committer_email" != "noreply@anthropic.com" ]]; then
              continue
            fi
            subject_re='^handover ([0-9]{4}-[0-9]{2}-[0-9]{2})$'
            if [[ ! "$subject" =~ $subject_re ]]; then
              continue
            fi
            data_date=${BASH_REMATCH[1]}
            records_update=false
            records_marker_count=$(git show "$candidate_ref:xuan-ib/index.html" |
              grep -Eic '<!--[[:space:]]*xuan-ib-records-update:v1[[:space:]]*-->' || true)
            if (( records_marker_count > 0 )); then
              records_update=true
            fi
            if [[ "$records_update" == true ]]; then
              if [[ "$data_date" != "$source_data_date" ]]; then
                continue
              fi
            elif [[ "$data_date" != "$today_hkt" && "$data_date" != "$yesterday_hkt" ]]; then
              continue
            fi

            if ! commit_epoch=$(git show -s --format='%ct' "$candidate_sha"); then
              echo "Skipping $branch_name: its commit timestamp cannot be read."
              continue
            fi
            if (( commit_epoch < now_epoch - 172800 || commit_epoch > future_cutoff_epoch )); then
              continue
            fi

            if ! commit_api_json=$(curl --fail --silent --show-error \
                -H 'Accept: application/vnd.github+json' \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$candidate_sha"); then
              echo "Skipping $branch_name: GitHub could not verify its commit."
              continue
            fi
            if ! verification_line=$(jq -er \
              '[.commit.verification.verified, .author.login, .committer.login] | @tsv' \
              <<< "$commit_api_json"); then
              echo "Skipping $branch_name: GitHub returned incomplete verification data."
              continue
            fi
            IFS=$'\t' read -r verified author_login committer_login <<< "$verification_line"
            if [[ "$verified" != "true" ]] ||
               [[ "$author_login" != "claude" ]] ||
               [[ "$committer_login" != "claude" ]]; then
              continue
            fi

            if ! git show "$candidate_ref:xuan-ib/index.html" > "$RUNNER_TEMP/handover.html"; then
              echo "Skipping $branch_name: its handover page cannot be materialized."
              continue
            fi
            if ! XUAN_IB_PREVIOUS_SOURCE_SHA="$meta_source_sha" \
                XUAN_IB_PREVIOUS_HTML_BLOB="$published_blob" \
                node scripts/handover-guard.mjs \
                  "$RUNNER_TEMP/handover.html" "$data_date" xuan-ib/latest.html; then
              echo "Skipping $branch_name: its handover page failed validation."
              continue
            fi
            jq \
              --arg ref "$candidate_ref" \
              --arg sha "$candidate_sha" \
              --arg dataDate "$data_date" \
              --arg htmlBlob "$candidate_blob" \
              --argjson commitEpoch "$commit_epoch" \
              '. + [{ref: $ref, sha: $sha, commitEpoch: $commitEpoch, dataDate: $dataDate, htmlBlob: $htmlBlob}]' \
              "$candidates_file" > "$RUNNER_TEMP/candidates.next.json"
            mv "$RUNNER_TEMP/candidates.next.json" "$candidates_file"
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin/claude/)

          node scripts/xuan-ib-promotion.mjs select \
            "$candidates_file" xuan-ib/latest.meta.json "$published_blob" > "$selected_file"
          candidate_sha=$(jq -r '.sha // empty' "$selected_file")

          if [[ -z "$candidate_sha" ]]; then
            echo 'No fresh handover is waiting; nothing to promote.'
            {
              echo '### XUAN-IB promotion'
              echo ''
              echo ':information_source: No unpublished, fresh, verified handover candidate was found.'
              echo "Trusted main remained at \`$base_sha\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo 'sha=' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          candidate_blob=$(jq -r '.htmlBlob' "$selected_file")
          commit_epoch=$(jq -r '.commitEpoch' "$selected_file")
          data_date=$(jq -r '.dataDate' "$selected_file")
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "data_date=$data_date" >> "$GITHUB_OUTPUT"
          echo "html_blob=$candidate_blob" >> "$GITHUB_OUTPUT"
          echo "commit_epoch=$commit_epoch" >> "$GITHUB_OUTPUT"

      - name: Publish the verified page behind the stable mobile loader
        if: steps.candidate.outputs.sha != ''
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          CANDIDATE_BLOB: ${{ steps.candidate.outputs.html_blob }}
          CANDIDATE_COMMIT_EPOCH: ${{ steps.candidate.outputs.commit_epoch }}
          EXPECTED_BASE_SHA: ${{ steps.candidate.outputs.base_sha }}
          DATA_DATE: ${{ steps.candidate.outputs.data_date }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [[ $(git rev-parse origin/main) != "$EXPECTED_BASE_SHA" ]]; then
            echo 'main changed after validation; refusing promotion' >&2
            exit 1
          fi

          previous_source_sha=$(jq -er \
            '.sourceSha | select(type == "string" and test("^[0-9a-f]{40}$"))' \
            xuan-ib/latest.meta.json)
          previous_html_blob=$(jq -er \
            '.htmlBlob | select(type == "string" and test("^[0-9a-f]{40}$"))' \
            xuan-ib/latest.meta.json)
          actual_previous_blob=$(git hash-object xuan-ib/latest.html)
          if [[ "$actual_previous_blob" != "$previous_html_blob" ]]; then
            echo 'Trusted previous HTML does not match latest.meta.json.' >&2
            exit 1
          fi
          cp xuan-ib/latest.html "$RUNNER_TEMP/previous-latest.html"

          source_tag="refs/tags/xuan-ib-published/${DATA_DATE}-${CANDIDATE_SHA:0:12}"
          remote_source_sha=$(git ls-remote origin "$source_tag" | awk '{print $1}')
          if [[ -z "$remote_source_sha" ]]; then
            git push origin "$CANDIDATE_SHA:$source_tag"
          elif [[ "$remote_source_sha" != "$CANDIDATE_SHA" ]]; then
            echo 'The immutable candidate source tag points at another commit.' >&2
            exit 1
          fi

          git show "$CANDIDATE_SHA:xuan-ib/index.html" > xuan-ib/latest.html
          XUAN_IB_PREVIOUS_SOURCE_SHA="$previous_source_sha" \
          XUAN_IB_PREVIOUS_HTML_BLOB="$previous_html_blob" \
            node scripts/handover-guard.mjs \
              xuan-ib/latest.html "$DATA_DATE" "$RUNNER_TEMP/previous-latest.html"
          actual_blob=$(git hash-object xuan-ib/latest.html)
          if [[ "$actual_blob" != "$CANDIDATE_BLOB" ]]; then
            echo 'Candidate blob changed while preparing the publication.' >&2
            exit 1
          fi

          jq -n \
            --arg ref 'origin/claude/trusted-selected' \
            --arg sha "$CANDIDATE_SHA" \
            --arg dataDate "$DATA_DATE" \
            --arg htmlBlob "$CANDIDATE_BLOB" \
            --argjson commitEpoch "$CANDIDATE_COMMIT_EPOCH" \
            '{ref: $ref, sha: $sha, commitEpoch: $commitEpoch, dataDate: $dataDate, htmlBlob: $htmlBlob}' \
            > "$RUNNER_TEMP/selected-candidate.json"
          node scripts/xuan-ib-promotion.mjs create-meta \
            "$RUNNER_TEMP/selected-candidate.json" > xuan-ib/latest.meta.json
          node scripts/xuan-ib-promotion.mjs validate-meta \
            xuan-ib/latest.meta.json "$actual_blob" \
            "$CANDIDATE_SHA" "$CANDIDATE_COMMIT_EPOCH" "$CANDIDATE_BLOB" "$DATA_DATE"

          # The menu is a derived view, never another source of report truth.
          # A verified report with unsupported menu markup publishes a disabled
          # menu; a mismatched meta/HTML pair still fails closed.
          node scripts/xuan-ib-decision-menu.mjs publish-manifest \
            xuan-ib/latest.meta.json xuan-ib/latest.html > xuan-ib/latest.decisions.json

          git add xuan-ib/latest.html xuan-ib/latest.meta.json xuan-ib/latest.decisions.json
          if git diff --cached --quiet; then
            echo 'Verified page already matches the published latest.html.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Publish XUAN-IB handover $DATA_DATE"
          git push origin HEAD:refs/heads/main

      - name: Observe the Pages rollout without gating promotion
        if: steps.candidate.outputs.sha != ''
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          CANDIDATE_BLOB: ${{ steps.candidate.outputs.html_blob }}
          DATA_DATE: ${{ steps.candidate.outputs.data_date }}
        run: |
          set -uo pipefail
          repo_name=${GITHUB_REPOSITORY#*/}
          base_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repo_name}/xuan-ib/"
          set +e
          result=$(timeout --signal=TERM 285s \
            node scripts/xuan-ib-publish-health.mjs probe \
            --base-url "$base_url" \
            --expected-sha "$CANDIDATE_SHA" \
            --expected-blob "$CANDIDATE_BLOB" \
            --expected-date "$DATA_DATE" \
            --attempts 20 \
            --interval-ms 15000 2>&1)
          probe_status=$?
          set -e
          probe_ok=false
          if (( probe_status == 0 )); then
            probe_ok=$(jq -r '.ok // false' <<< "$result" 2>/dev/null || printf false)
          fi
          if [[ "$probe_ok" == true ]]; then
            {
              echo '### XUAN-IB Pages observation'
              echo ''
              echo ":white_check_mark: The fixed mobile page exposed the promoted bytes after $(jq -r '.attempts' <<< "$result") probe attempt(s)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '### XUAN-IB Pages observation'
              echo ''
              echo ':warning: Promotion to `main` succeeded, but Pages did not expose the same bytes within about five minutes.'
              echo ''
              echo 'This observation is non-gating: Pages rollout delay does not change the promotion result.'
              echo ''
              echo '```json'
              if ! jq . <<< "$result" 2>/dev/null; then
                printf '%s\n' "$result"
              fi
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # This observer is intentionally non-gating. A network, JSON, script,
          # or eventual-consistency problem is recorded above but never changes
          # the already completed promotion result.
          exit 0
