name: Refresh public benchmark closes

on:
  schedule:
    # HKT 07:35 and then hourly 09:35-17:35 retries after each Mon-Fri US
    # session. The final Friday-session retry lands on HKT Sunday because the
    # schedule is expressed in UTC. Every attempt is idempotent and changes the
    # cache only when both ETFs validate.
    #
    # Why hourly: between 2026-09-14 and 2026-09-18 GitHub delivered only two
    # of the four scheduled slots per day (one around 01:30 UTC, one between
    # 06:30 and 09:00 UTC), and Yahoo did not yet serve the previous close at
    # the 01:30 UTC attempt on two of those four days, so the 12:30 HKT
    # producer published 2026-09-15 and 2026-09-17 without a benchmark. More
    # slots before the producer raise the odds; the producer may also dispatch
    # this workflow on demand (see .claude/rules/fee-console-daily.md).
    - cron: '35 23,1-9 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-benchmark-cache
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare isolated cache branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp scripts/refresh-benchmark-cache.mjs "$RUNNER_TEMP/refresh-benchmark-cache.mjs"
          cp benchmark-close.json "$RUNNER_TEMP/benchmark-close.seed.json"
          if git ls-remote --exit-code origin refs/heads/market-data-cache >/dev/null 2>&1; then
            git fetch --no-tags origin refs/heads/market-data-cache:refs/remotes/origin/market-data-cache
            git switch --track -c market-data-cache origin/market-data-cache
          else
            git switch --orphan market-data-cache
            git rm -rf --ignore-unmatch .
            cp "$RUNNER_TEMP/benchmark-close.seed.json" benchmark-close.json
          fi

      - name: Fetch and validate completed ETF closes
        shell: bash
        run: node "$RUNNER_TEMP/refresh-benchmark-cache.mjs"

      - name: Publish cache when a completed close changed
        shell: bash
        run: |
          set -euo pipefail
          git add benchmark-close.json
          if git diff --cached --quiet; then
            echo 'No new completed close.'
            exit 0
          fi
          git commit -m "market data $(date -u +%F)"
          git push origin HEAD:market-data-cache
