name: Fee console cloud producer

on:
  schedule:
    # HKT Tue-Sat 10:00 first attempt. Independent 11:40, 11:55 and 12:20
    # idempotent slots reduce the impact of a delayed or dropped GitHub schedule
    # event; the later slots still pick up delayed source data without a Mac.
    - cron: '0 2 * * 2-6'
    - cron: '40,55 3 * * 2-6'
    - cron: '20,50 4 * * 2-6'
    - cron: '50 5,7,9 * * 2-6'
  workflow_dispatch:
    inputs:
      run_reviewed_once:
        description: Explicit manual report request; automatic daily dispatches stay paused
        type: boolean
        required: false
        default: false
      apply_style_proposal:
        description: Apply one separately approved private style proposal
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: fee-cloud-producer
  cancel-in-progress: false

jobs:
  produce:
    # Pause the legacy daily cron and automated dispatch defaults. Preserve the
    # explicit manual path; this flag does not replace source or release gates.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_reviewed_once && (vars.FEE_CLOUD_MODE == 'shadow' || vars.FEE_CLOUD_MODE == 'publish') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: fee-cloud-producer
    steps:
      - name: Check out trusted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Read the independent benchmark cache
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin market-data-cache:refs/remotes/origin/market-data-cache
          mkdir -m 700 "$RUNNER_TEMP/fee-cloud-private"
          git show origin/market-data-cache:benchmark-close.json > "$RUNNER_TEMP/fee-cloud-private/benchmark-close.json"
          chmod 600 "$RUNNER_TEMP/fee-cloud-private/benchmark-close.json"

      - name: Check whether this complete target is already published
        id: published
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          summary=$(node scripts/fee-cloud-producer.mjs \
            --mode=published-preflight \
            --benchmark-file="$RUNNER_TEMP/fee-cloud-private/benchmark-close.json")
          node - "$summary" <<'NODE'
          const fs = require('fs'), result = JSON.parse(process.argv[2]);
          if (result.schema !== 'fee-console.published-preflight.v1'
              || !['produce', 'already-published'].includes(result.outcome)
              || !/^\d{4}-\d{2}-\d{2}$/.test(result.targetDate)) throw new Error('unexpected publication decision');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `outcome=${result.outcome}\ntarget=${result.targetDate}\n`);
          if (result.outcome === 'already-published') fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## Fee cloud producer\n\n- Target: ${result.targetDate}\n- Outcome: already-published\n\nThe existing main receipt and encrypted data were verified. Its source check time is unchanged.\n`);
          NODE

      - name: Refresh the producer base after publication preflight
        if: ${{ steps.published.outputs.outcome == 'produce' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout --detach origin/main

      - name: Exchange the trusted workflow identity for short-lived Google credentials
        if: ${{ steps.published.outputs.outcome == 'produce' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: family-portfolio-gateway
          workload_identity_provider: projects/860729177589/locations/global/workloadIdentityPools/fee-console-github/providers/fee-console-main
          service_account: fee-cloud-producer@family-portfolio-gateway.iam.gserviceaccount.com

      - name: Read the isolated cloud Sharesight credentials
        id: sharesight_credentials
        if: ${{ steps.published.outputs.outcome == 'produce' }}
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262
        with:
          secrets: |-
            client_id:family-portfolio-gateway/sharesight-broker-sync-client-id/1
            client_secret:family-portfolio-gateway/sharesight-broker-sync-client-secret/1

      - name: Read, calculate and validate the encrypted candidate
        id: producer
        if: ${{ steps.published.outputs.outcome == 'produce' }}
        shell: bash
        env:
          FEE_CLOUD_SHARESIGHT_CLIENT_ID: ${{ steps.sharesight_credentials.outputs.client_id }}
          FEE_CLOUD_SHARESIGHT_CLIENT_SECRET: ${{ steps.sharesight_credentials.outputs.client_secret }}
          FEE_DATA_KEY: ${{ secrets.FEE_DATA_KEY }}
          FEE_ECON_GIST_ID: ${{ secrets.FEE_ECON_GIST_ID }}
          APPLY_STYLE_PROPOSAL: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_style_proposal }}
          FEE_STYLE_PROPOSAL_JSON: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_style_proposal && secrets.FEE_STYLE_PROPOSAL_JSON || '' }}
          FEE_STYLE_PROPOSAL_LOCK: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_style_proposal && secrets.FEE_STYLE_PROPOSAL_LOCK || '' }}
        run: |
          set -euo pipefail
          style_args=()
          if [[ "$APPLY_STYLE_PROPOSAL" == 'true' ]]; then
            node <<'NODE'
            const fs = require('fs'), path = require('path');
            try {
              const text = process.env.FEE_STYLE_PROPOSAL_JSON;
              if (!text || Buffer.byteLength(text) > 64 * 1024) throw new Error();
              fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'fee-cloud-private', 'style-proposal.json'),
                text, {mode: 0o600, flag: 'wx'});
            } catch { console.error('FEE_CLOUD_STYLE_PROPOSAL_INPUT'); process.exit(1); }
          NODE
            style_args+=("--style-proposal-file=$RUNNER_TEMP/fee-cloud-private/style-proposal.json")
          fi
          unset FEE_STYLE_PROPOSAL_JSON
          error_file="$RUNNER_TEMP/fee-cloud-private/producer-error.txt"
          if ! summary=$(node scripts/fee-cloud-producer.mjs \
            --benchmark-file="$RUNNER_TEMP/fee-cloud-private/benchmark-close.json" \
            --target-date="${{ steps.published.outputs.target }}" \
            --out-dir="$RUNNER_TEMP/fee-cloud-private" "${style_args[@]}" 2>"$error_file"); then
            code=$(tail -n 1 "$error_file")
            if [[ ! "$code" =~ ^(FEE_CLOUD|SOURCE)_[A-Z0-9_]+$ ]]; then
              code=FEE_CLOUD_FAILED
            fi
            printf '%s\n' "$code"
            printf '## Fee cloud producer\n\n- Outcome: failed closed\n- Diagnostic code: `%s`\n\nNo portfolio amounts or credentials are included in this summary.\n' "$code" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          node - "$summary" >> "$GITHUB_STEP_SUMMARY" <<'NODE'
          const result = JSON.parse(process.argv[2]);
          if (result.schema !== 'fee-console.cloud-producer.v1') throw new Error('unexpected producer summary');
          process.stdout.write([
            '## Fee cloud producer', '',
            `- Target: ${result.targetDate}`,
            `- Outcome: ${result.outcome}`,
            `- Transient source retries: ${result.retryCount}`,
            `- Source dates: Schwab ${result.sourceDates.schwab}; Webull ${result.sourceDates.webull}; benchmark ${result.sourceDates.benchmark}`,
            '', 'No portfolio amounts or credentials are included in this summary.', ''
          ].join('\n'));
          NODE
          target=$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(x.targetDate)' "$summary")
          outcome=$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(x.outcome)' "$summary")
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

      - name: Create a signed owner candidate
        id: candidate
        if: ${{ vars.FEE_CLOUD_MODE == 'publish' && steps.published.outputs.outcome == 'produce' }}
        shell: bash
        env:
          FEE_CLOUD_GITHUB_TOKEN: ${{ secrets.FEE_CLOUD_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/fee-cloud-commit.mjs \
            --data="$RUNNER_TEMP/fee-cloud-private/data.json" \
            --health="$RUNNER_TEMP/fee-cloud-private/fee-data-health.json" \
            --base-sha="$(git rev-parse HEAD)"

      - name: Explain shadow mode
        if: ${{ vars.FEE_CLOUD_MODE == 'shadow' && steps.published.outputs.outcome == 'produce' }}
        shell: bash
        run: echo 'Shadow mode validated the full private calculation and intentionally published nothing.' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove private runtime files
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -d "$RUNNER_TEMP/fee-cloud-private" ]]; then
            find "$RUNNER_TEMP/fee-cloud-private" -type f -exec shred -u {} + 2>/dev/null || true
            rm -rf "$RUNNER_TEMP/fee-cloud-private"
          fi
