            rm -rf "$RUNNER_TEMP/fee-ib-diagnostic"
          fi

  ib-envelope-evidence:
    # Same reserved read-only title as the diagnostic, so period budgets and the
    # supervisor treat it as no production. Only the Sharesight OAuth pair is
    # injected: no FEE_DATA_KEY, economic source, writer, storage or publication.
    name: IB diagnostic 2026-11-06
    if: ${{ !inputs.ib_diagnostic_once && !inputs.ib_diagnostic_main && !inputs.confirmed_main && !inputs.ratio_plan && !inputs.ratio_main && !inputs.recovery_main && !inputs.run_reviewed_once && !inputs.source_plan_check_only && !inputs.source_acceptance_once && inputs.report_kind == '' && inputs.ib_envelope_once && inputs.ib_envelope_main == github.sha && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor_id == '283054367' && github.run_attempt == 1 && !inputs.source_probe_once && !inputs.source_probe_main && !inputs.source_probe_target }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: fee-cloud-producer
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - name: Verify the exact envelope evidence release and owner run before credentials
        env:
          ENVELOPE_MAIN: ${{ inputs.ib_envelope_main }}
          FEE_REPORT_ACTIONS_TOKEN: ${{ github.token }}
        run: node scripts/ib-v3-envelope-evidence.mjs --check-plan --expected-main="$ENVELOPE_MAIN"
      - name: Reuse the existing read identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: family-portfolio-gateway
          workload_identity_provider: projects/860729177589/locations/global/workloadIdentityPools/fee-console-github/providers/fee-console-main
          service_account: fee-cloud-producer@family-portfolio-gateway.iam.gserviceaccount.com
      - name: Read only the existing Sharesight pair
        id: envelope_credentials
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262
        with:
          secrets: |-
            client_id:family-portfolio-gateway/sharesight-broker-sync-client-id/1
            client_secret:family-portfolio-gateway/sharesight-broker-sync-client-secret/1
      - name: Compare the fixed IB v3 responses without a reader, writer or publication token
        env:
          ENVELOPE_MAIN: ${{ inputs.ib_envelope_main }}
          FEE_REPORT_ACTIONS_TOKEN: ${{ github.token }}
          FEE_CLOUD_SHARESIGHT_CLIENT_ID: ${{ steps.envelope_credentials.outputs.client_id }}
          FEE_CLOUD_SHARESIGHT_CLIENT_SECRET: ${{ steps.envelope_credentials.outputs.client_secret }}
          GOOGLE_APPLICATION_CREDENTIALS: ''
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ''
          GOOGLE_GHA_CREDS_PATH: ''
        run: node scripts/ib-v3-envelope-evidence.mjs --expected-main="$ENVELOPE_MAIN"

  source-probe:
    # Separately approved, read-only. Same trusted workflow path, so the existing
    # Workload Identity provider and the two version-pinned Sharesight secrets
    # are reused unchanged; only those two values reach the probe step. No
    # FEE_DATA_KEY, economic source, benchmark, writer, candidate, storage,
    # issue or publication token. Not a production attempt.
    name: Fee source probe
    if: ${{ inputs.source_probe_once && inputs.source_probe_main == github.sha && inputs.source_probe_target != '' && !inputs.ib_diagnostic_once && !inputs.ib_diagnostic_main && !inputs.ib_envelope_once && !inputs.ib_envelope_main && !inputs.confirmed_main && !inputs.ratio_plan && !inputs.ratio_main && !inputs.recovery_main && !inputs.run_reviewed_once && !inputs.source_plan_check_only && !inputs.source_acceptance_once && !inputs.source_from && !inputs.source_target && !inputs.source_main && !inputs.manual_sync_completed_for && inputs.report_kind == '' && !inputs.report_target && !inputs.report_markets && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor_id == '283054367' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: fee-cloud-producer
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      # Check out the exact approved commit, never whatever main is by then.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the exact probe main, owner run and target before credentials
        env:
          PROBE_MAIN: ${{ inputs.source_probe_main }}
          PROBE_TARGET: ${{ inputs.source_probe_target }}
          FEE_REPORT_ACTIONS_TOKEN: ${{ github.token }}
        run: test "$(git rev-parse HEAD)" = "$PROBE_MAIN" && node scripts/fee-source-probe.mjs --check-plan --expected-main="$PROBE_MAIN" --target="$PROBE_TARGET"
      - name: Reuse the existing read identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: family-portfolio-gateway
          workload_identity_provider: projects/860729177589/locations/global/workloadIdentityPools/fee-console-github/providers/fee-console-main
          service_account: fee-cloud-producer@family-portfolio-gateway.iam.gserviceaccount.com
      - name: Read only the existing Sharesight pair
        id: probe_credentials
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262
        with:
          secrets: |-
            client_id:family-portfolio-gateway/sharesight-broker-sync-client-id/1
            client_secret:family-portfolio-gateway/sharesight-broker-sync-client-secret/1
      - name: Probe the fixed ordinary source routes without a ledger, writer or publication token
        env:
          PROBE_MAIN: ${{ inputs.source_probe_main }}
          PROBE_TARGET: ${{ inputs.source_probe_target }}
          FEE_REPORT_ACTIONS_TOKEN: ${{ github.token }}
          FEE_CLOUD_SHARESIGHT_CLIENT_ID: ${{ steps.probe_credentials.outputs.client_id }}
          FEE_CLOUD_SHARESIGHT_CLIENT_SECRET: ${{ steps.probe_credentials.outputs.client_secret }}
          GOOGLE_APPLICATION_CREDENTIALS: ''
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ''
          GOOGLE_GHA_CREDS_PATH: ''
        run: test "$(git rev-parse HEAD)" = "$PROBE_MAIN" && node scripts/fee-source-probe.mjs --expected-main="$PROBE_MAIN" --target="$PROBE_TARGET"
      # Second, independent read-only check in the same approved probe run: can
      # this same client read the All Together classification report through
      # the API? It lives in this job only because the existing Workload
      # Identity provider admits no other workflow file, and adding a job or an
      # input would change how production runs are classified. It gets the same
      # two Sharesight values and nothing else (no Actions token), runs whether
      # or not the fee probe step passed, and prints one line of value-free
      # JSON. No writer, candidate, snapshot, storage or publication.
      - name: Probe the fixed ratio classification routes with the same pair and nothing else
        if: ${{ !cancelled() && steps.probe_credentials.outcome == 'success' }}
        env:
          PROBE_MAIN: ${{ inputs.source_probe_main }}
          PROBE_TARGET: ${{ inputs.source_probe_target }}
          FEE_CLOUD_SHARESIGHT_CLIENT_ID: ${{ steps.probe_credentials.outputs.client_id }}
          FEE_CLOUD_SHARESIGHT_CLIENT_SECRET: ${{ steps.probe_credentials.outputs.client_secret }}
          GOOGLE_APPLICATION_CREDENTIALS: ''
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ''
          GOOGLE_GHA_CREDS_PATH: ''
        run: test "$(git rev-parse HEAD)" = "$PROBE_MAIN" && node scripts/fee-ratio-source-probe.mjs --expected-main="$PROBE_MAIN" --target="$PROBE_TARGET"
