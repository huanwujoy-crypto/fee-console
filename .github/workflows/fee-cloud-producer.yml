name: Fee console cloud producer
run-name: ${{ inputs.source_probe_once && 'Fee source probe' || (inputs.ib_diagnostic_once || inputs.ib_envelope_once) && 'IB diagnostic 2026-11-06' || (inputs.ratio_plan != '' || inputs.ratio_main != '') && 'Manual ratio snapshot' || github.workflow }}

on:
  schedule:
    # Public market gate: HKT09:00 first check, same-day11:30/14:00 continuation.
    # Unknown/closed markets or an incomplete month-end enter no source.
    - cron: '0 1 * * *'
    - cron: '30 3 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      ib_diagnostic_once:
        description: Separately approved read-only Jenny diagnostic for 2026-11-06; no production or publication
        type: boolean
        required: false
        default: false
      ib_diagnostic_main:
        description: Exact approved main for the one read-only diagnostic
        type: string
        required: false
        default: ''
      ib_envelope_once:
        description: Separately approved read-only IB v3 response-envelope evidence for 2026-11-06; no stability decision, writer or publication
        type: boolean
        required: false
        default: false
      ib_envelope_main:
        description: Exact approved main for the one envelope evidence run
        type: string
        required: false
        default: ''
      ratio_main:
        description: Exact reviewed main for a manual ratio operation; leave blank for fees
        type: string
        required: false
        default: ''
      ratio_plan:
        description: Reviewed ratio plan JSON with hashes and object generations only; never credentials or holdings
        type: string
        required: false
        default: ''
      source_plan_check_only:
        description: Public code/date plan check only; no financial environment or credentials
        type: boolean
        required: false
        default: false
      source_acceptance_once:
        description: One separately approved Sharesight field check; no fee decryption or publication
        type: boolean
        required: false
        default: false
      source_from:
        description: Reviewed field-check first date, maximum four dates
        type: string
        required: false
        default: ''
      source_target:
        description: Reviewed completed field-check last date
        type: string
        required: false
        default: ''
      source_main:
        description: Exact protected main SHA approved for this field check
        type: string
        required: false
        default: ''
      run_reviewed_once:
        description: Run one reviewed daily/weekly/monthly report; completed-sync daily may start before09
        type: boolean
        required: false
        default: false
      manual_sync_completed_for:
        description: For reviewed daily only, confirm all three accounts synchronized for this exact YYYY-MM-DD; source and month-end gates still apply
        type: string
        required: false
        default: ''
      confirmed_main:
        description: Optional exact main binding for a caller-reviewed completed-sync daily request; not human approval
        type: string
        required: false
        default: ''
      recovery_main:
        description: Separately approved single-use recovery for a code-pinned target; exact signed immediate-successor main SHA, never resets ordinary budgets
        type: string
        required: false
        default: ''
      report_kind:
        description: Leave blank for the next due period; automatic-daily is the opted-in clock path, never a reviewed one-off
        type: string
        required: false
        default: ''
      report_target:
        description: Reviewed accounting cutoff YYYY-MM-DD (not the generation date)
        type: string
        required: false
        default: ''
      report_markets:
        description: Separately reviewed one-off triggering calendars; never used by scheduled runs
        type: string
        required: false
        default: ''
      source_probe_once:
        description: Separately approved read-only Sharesight source probe for one target; no ledger, economic source, writer, candidate or publication
        type: boolean
        required: false
        default: false
      source_probe_main:
        description: Exact approved main for the one read-only source probe
        type: string
        required: false
        default: ''
      source_probe_target:
        description: Owner-chosen source probe date YYYY-MM-DD (at most four Hong Kong days old)
        type: string
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

concurrency:
  group: fee-cloud-producer
  cancel-in-progress: false

jobs:
  period:
    # The clock has an explicit automatic-daily mode; it never asserts human review.
    if: ${{ !inputs.ib_diagnostic_once && !inputs.ib_diagnostic_main && !inputs.ratio_plan && !inputs.ratio_main && !inputs.ib_envelope_once && !inputs.ib_envelope_main && (!inputs.confirmed_main || (inputs.run_reviewed_once && inputs.report_kind == 'daily' && inputs.manual_sync_completed_for == inputs.report_target && !inputs.recovery_main && !inputs.report_markets && vars.FEE_REPORT_ONCE_MAIN == '')) && !inputs.source_plan_check_only && !inputs.source_acceptance_once && ((github.event_name == 'schedule' && vars.FEE_REPORT_PERIODS_ENABLED == 'true' && (vars.FEE_REPORT_ONCE_MAIN != '' || (vars.FEE_REPORT_DAILY_ENABLED == 'true' && vars.FEE_CLOUD_MODE == 'publish'))) || (github.event_name == 'workflow_dispatch' && ((inputs.run_reviewed_once && inputs.report_kind != 'automatic-daily') || (!inputs.run_reviewed_once && inputs.report_kind == 'automatic-daily' && vars.FEE_REPORT_ONCE_MAIN == '' && vars.FEE_REPORT_DAILY_ENABLED == 'true' && vars.FEE_REPORT_PERIODS_ENABLED == 'true' && vars.FEE_CLOUD_MODE == 'publish' && github.actor_id == '283054367' && github.ref == 'refs/heads/main' && github.run_attempt == 1)))) && (vars.FEE_CLOUD_MODE == 'shadow' || vars.FEE_CLOUD_MODE == 'publish') && !inputs.source_probe_once && !inputs.source_probe_main && !inputs.source_probe_target }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      outcome: ${{ steps.plan.outputs.outcome }}
      target: ${{ steps.plan.outputs.target }}
      kind: ${{ steps.plan.outputs.kind }}
      main: ${{ steps.plan.outputs.main }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Check out trusted main for public period gate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.confirmed_main && github.sha || 'main' }}
          persist-credentials: false
      - name: Plan daily coverage and month-end archive without financial credentials
        id: plan
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FEE_REPORT_ACTIONS_TOKEN: ${{ github.token }}
          FEE_REPORT_ONCE_MAIN: ${{ vars.FEE_REPORT_ONCE_MAIN }}
          FEE_REPORT_DAILY_ENABLED: ${{ vars.FEE_REPORT_DAILY_ENABLED }}
          FEE_AUTOMATIC_DAILY_REQUEST: ${{ github.event_name == 'workflow_dispatch' && inputs.report_kind == 'automatic-daily' && 'true' || '' }}
          FEE_REPORT_PERIODS_ENABLED: ${{ vars.FEE_REPORT_PERIODS_ENABLED }}
          FEE_CLOUD_MODE: ${{ vars.FEE_CLOUD_MODE }}
          IB_MANAGER_READ_ENABLED: 'true'
          FEE_REPORT_MARKETS: ${{ vars.FEE_REPORT_MARKETS }}
          REVIEWED_KIND: ${{ github.event_name == 'workflow_dispatch' && inputs.run_reviewed_once && inputs.report_kind || '' }}
          REVIEWED_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.run_reviewed_once && inputs.report_target || '' }}
          REVIEWED_MARKETS: ${{ github.event_name == 'workflow_dispatch' && inputs.run_reviewed_once && inputs.report_markets || '' }}
          REVIEWED_SYNC_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.run_reviewed_once && inputs.manual_sync_completed_for || '' }}
          CONFIRMED_MAIN: ${{ inputs.confirmed_main }}
          REVIEWED_RECOVERY_MAIN: ${{ github.event_name == 'workflow_dispatch' && inputs.run_reviewed_once && inputs.recovery_main || '' }}
        run: |
          set -euo pipefail
          if [[ -n "$FEE_REPORT_ONCE_MAIN" ]]; then
            scope=$(node scripts/fee-report-producer.mjs --mode=once-scope)
            if [[ $(node -e 'process.stdout.write(JSON.parse(process.argv[1]).state)' "$scope") != active ]]; then
              echo 'outcome=not-due' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          args=(--mode=preflight)
          if [[ -n "$REVIEWED_KIND" || -n "$REVIEWED_TARGET" ]]; then
            args+=("--report-kind=$REVIEWED_KIND" "--report-target=$REVIEWED_TARGET")
          fi
          if [[ -n "$REVIEWED_MARKETS" ]]; then
            args+=("--report-markets=$REVIEWED_MARKETS")
          fi
          if [[ -n "$REVIEWED_SYNC_DATE" ]]; then
            args+=("--manual-sync-completed-for=$REVIEWED_SYNC_DATE")
          fi
          if [[ -n "$CONFIRMED_MAIN" ]]; then
            args+=("--confirmed-main=$CONFIRMED_MAIN")
          fi
          if [[ -n "$REVIEWED_RECOVERY_MAIN" ]]; then
            args+=("--recovery-main=$REVIEWED_RECOVERY_MAIN")
          fi
          summary=$(node scripts/fee-report-producer.mjs "${args[@]}")
          node --input-type=module - "$summary" <<'NODE'
          import fs from 'node:fs';
          import {reportPreflightSummary} from './scripts/fee-report-producer.mjs';
          const r=JSON.parse(process.argv[2]);
          if(r.schema!=='fee-console.report-preflight.v1'||!['produce','already-published','not-due','waiting','candidate-pending','recovery-required'].includes(r.outcome))throw Error('unexpected period decision');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`outcome=${r.outcome}\n`);
          if(r.outcome==='produce'){
            if(!/^\d{4}-\d{2}-\d{2}$/.test(r.plan?.accountingThrough)||!['daily','daily-monthly','weekly','monthly','weekly-monthly'].includes(r.plan?.kind)||!/^[a-f0-9]{40}$/.test(r.mainSha))throw Error('invalid frozen period');
            const kind=r.plan.kind.startsWith('daily')?'daily':r.plan.kind==='monthly'?'monthly':'weekly';
            fs.appendFileSync(process.env.GITHUB_OUTPUT,`target=${r.plan.accountingThrough}\nkind=${kind}\nmain=${r.mainSha}\nplan=${JSON.stringify(r.plan)}\n`);
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,reportPreflightSummary(r));
          if(r.outcome==='recovery-required')throw Error('FEE_REPORT_RECOVERY_REQUIRED');
          NODE

  once-admit:
    needs: period
    if: ${{ !inputs.ib_diagnostic_once && !inputs.ib_diagnostic_main && !inputs.ratio_plan && !inputs.ratio_main && !inputs.ib_envelope_once && !inputs.ib_envelope_main && !inputs.confirmed_main && vars.FEE_REPORT_ONCE_MAIN != '' && needs.period.outputs.outcome == 'produce' && !inputs.source_probe_once && !inputs.source_probe_main && !inputs.source_probe_target }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.period.outputs.main }}
          persist-credentials: false
      - name: Reserve this target once and close later producer entries
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FEE_REPORT_ONCE_MAIN: ${{ vars.FEE_REPORT_ONCE_MAIN }}
          ONCE_PLAN: ${{ needs.period.outputs.plan }}
          FEE_CLOUD_MODE: ${{ vars.FEE_CLOUD_MODE }}
        run: node scripts/fee-report-producer.mjs --mode=once-admit

  produce:
    name: Produce ${{ needs.period.outputs.kind }} ${{ needs.period.outputs.target }}
    needs: [period, once-admit]
    if: ${{ !inputs.ib_diagnostic_once && !inputs.ib_diagnostic_main && !inputs.ratio_plan && !inputs.ratio_main && !inputs.ib_envelope_once && !inputs.ib_envelope_main && !cancelled() && !inputs.source_plan_check_only && github.run_attempt == 1 && needs.period.outputs.outcome == 'produce' && (vars.FEE_REPORT_ONCE_MAIN == '' || needs['once-admit'].result == 'success') && (vars.FEE_CLOUD_MODE == 'shadow' || vars.FEE_CLOUD_MODE == 'publish') && !inputs.source_probe_once && !inputs.source_probe_main && !inputs.source_probe_target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: fee-cloud-producer
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      candidate: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Check out trusted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm the reserved run before any financial credentials
        if: ${{ vars.FEE_REPORT_ONCE_MAIN != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FEE_REPORT_ONCE_MAIN: ${{ vars.FEE_REPORT_ONCE_MAIN }}
          FEE_CLOUD_MODE: ${{ vars.FEE_CLOUD_MODE }}
        run: node scripts/fee-report-producer.mjs --mode=once-confirm

      - name: Require scheduled daily scope and Jenny IB configuration before financial access
        env:
          IB_MANAGER_READ_ENABLED: 'true'
          IB_MANAGER_BASELINE_SHA256: ${{ vars.IB_MANAGER_BASELINE_SHA256 }}
          FEE_REPORT_ONCE_MAIN: ${{ vars.FEE_REPORT_ONCE_MAIN }}
          FEE_REPORT_DAILY_ENABLED: ${{ vars.FEE_REPORT_DAILY_ENABLED }}
          FEE_AUTOMATIC_DAILY_REQUEST: ${{ github.event_name == 'workflow_dispatch' && inputs.report_kind == 'automatic-daily' && 'true' || '' }}
          FEE_REPORT_PERIODS_ENABLED: ${{ vars.FEE_REPORT_PERIODS_ENABLED }}
          FEE_CLOUD_MODE: ${{ vars.FEE_CLOUD_MODE }}
          PLANNED_MAIN: ${{ needs.period.outputs.main }}
          REPORT_KIND: ${{ needs.period.outputs.kind }}
          REPORT_TARGET: ${{ needs.period.outputs.target }}
        run: |
          node --input-type=module <<'NODE'
          import {scheduledDailyContext} from './scripts/fee-report-producer.mjs';
          import {assertIbManagerConfiguration} from './scripts/ib-manager-report.mjs';
          scheduledDailyContext({mode:'produce','report-kind':process.env.REPORT_KIND,'report-target':process.env.REPORT_TARGET});
          assertIbManagerConfiguration();
          NODE

      - name: Read the independent benchmark cache
        id: benchmark_base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin market-data-cache:refs/remotes/origin/market-data-cache
          echo "sha=$(git rev-parse origin/market-data-cache)" >> "$GITHUB_OUTPUT"
          mkdir -m 700 "$RUNNER_TEMP/fee-cloud-private"
          git show origin/market-data-cache:benchmark-close.json > "$RUNNER_TEMP/fee-cloud-private/benchmark-close.json"
          chmod 600 "$RUNNER_TEMP/fee-cloud-private/benchmark-close.json"

      - name: Confirm the frozen period base before financial access
        shell: bash
        env:
          FEE_REPORT_ACTIONS_TOKEN: ${{ github.token }}
          PLANNED_MAIN: ${{ needs.period.outputs.main }}
          CONFIRMED_MAIN: ${{ inputs.confirmed_main }}
          REPORT_KIND: ${{ needs.period.outputs.kind }}
          REPORT_TARGET: ${{ needs.period.outputs.target }}
          REPORT_PLAN: ${{ needs.period.outputs.plan }}
          REVIEWED_SYNC_DATE: ${{ inputs.manual_sync_completed_for }}
          REVIEWED_RECOVERY_MAIN: ${{ github.event_name == 'workflow_dispatch' && inputs.run_reviewed_once && inputs.recovery_main || '' }}
        run: |
          set -euo pipefail
          export CHECKED_OUT_MAIN="$(git rev-parse HEAD)"
          test "$CHECKED_OUT_MAIN" = "$PLANNED_MAIN"
          node --input-type=module <<'NODE'
          import {confirmReviewedMainBeforeSource,confirmReviewedRecoveryBeforeSource} from './scripts/fee-report-producer.mjs';
          const args={mode:'produce','report-kind':process.env.REPORT_KIND,'report-target':process.env.REPORT_TARGET};
          if(process.env.CONFIRMED_MAIN)args['confirmed-main']=process.env.CONFIRMED_MAIN;
          if(process.env.REVIEWED_SYNC_DATE)args['manual-sync-completed-for']=process.env.REVIEWED_SYNC_DATE;
          await confirmReviewedMainBeforeSource(args,{checkedOutMain:process.env.CHECKED_OUT_MAIN});
          if(process.env.REVIEWED_RECOVERY_MAIN)args['recovery-main']=process.env.REVIEWED_RECOVERY_MAIN;
          await confirmReviewedRecoveryBeforeSource(args,{checkedOutMain:process.env.CHECKED_OUT_MAIN});
          NODE

      - name: Exchange the trusted workflow identity for short-lived Google credentials
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: family-portfolio-gateway
          workload_identity_provider: projects/860729177589/locations/global/workloadIdentityPools/fee-console-github/providers/fee-console-main
          service_account: fee-cloud-producer@family-portfolio-gateway.iam.gserviceaccount.com

      - name: Read the isolated cloud Sharesight credentials
        id: sharesight_credentials
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262
        with:
          secrets: |-
            client_id:family-portfolio-gateway/sharesight-broker-sync-client-id/1
            client_secret:family-portfolio-gateway/sharesight-broker-sync-client-secret/1

      - name: Complete the frozen price cutoff from Sharesight
        shell: bash
        env:
          FEE_CLOUD_SHARESIGHT_CLIENT_ID: ${{ steps.sharesight_credentials.outputs.client_id }}
          FEE_CLOUD_SHARESIGHT_CLIENT_SECRET: ${{ steps.sharesight_credentials.outputs.client_secret }}
          FEE_BENCHMARK_SPY_HOLDING_ID: ${{ vars.FEE_BENCHMARK_SPY_HOLDING_ID }}
          FEE_BENCHMARK_QQQ_HOLDING_ID: ${{ vars.FEE_BENCHMARK_QQQ_HOLDING_ID }}
          FEE_CLOUD_GITHUB_TOKEN: ${{ vars.FEE_CLOUD_MODE == 'publish' && secrets.FEE_CLOUD_GITHUB_TOKEN || '' }}
          FEE_CLOUD_MODE: ${{ vars.FEE_CLOUD_MODE }}
          PLANNED_MAIN: ${{ needs.period.outputs.main }}
          BENCHMARK_CACHE_HEAD: ${{ steps.benchmark_base.outputs.sha }}
          REPORT_PLAN: ${{ needs.period.outputs.plan }}
        run: |
          set -euo pipefail
          export BENCHMARK_CACHE_PATH="$RUNNER_TEMP/fee-cloud-private/benchmark-close.json"
          node scripts/refresh-benchmark-cache.mjs --sharesight-cloud

      - name: Read, calculate and validate the encrypted candidate
        id: producer
        shell: bash
        env:
          FEE_REPORT_ACTIONS_TOKEN: ${{ github.token }}
          FEE_CLOUD_SHARESIGHT_CLIENT_ID: ${{ steps.sharesight_credentials.outputs.client_id }}
          FEE_CLOUD_SHARESIGHT_CLIENT_SECRET: ${{ steps.sharesight_credentials.outputs.client_secret }}
          FEE_DATA_KEY: ${{ secrets.FEE_DATA_KEY }}
          IB_MANAGER_READ_ENABLED: 'true'
          IB_MANAGER_BASELINE_SHA256: ${{ vars.IB_MANAGER_BASELINE_SHA256 }}
          FEE_ECON_GIST_ID: ${{ secrets.FEE_ECON_GIST_ID }}
          FEE_REPORT_ONCE_MAIN: ${{ vars.FEE_REPORT_ONCE_MAIN }}
          FEE_REPORT_DAILY_ENABLED: ${{ vars.FEE_REPORT_DAILY_ENABLED }}
          FEE_AUTOMATIC_DAILY_REQUEST: ${{ github.event_name == 'workflow_dispatch' && inputs.report_kind == 'automatic-daily' && 'true' || '' }}
          FEE_REPORT_PERIODS_ENABLED: ${{ vars.FEE_REPORT_PERIODS_ENABLED }}
          FEE_CLOUD_MODE: ${{ vars.FEE_CLOUD_MODE }}
          PLANNED_MAIN: ${{ needs.period.outputs.main }}
          REPORT_KIND: ${{ needs.period.outputs.kind }}
          REPORT_TARGET: ${{ needs.period.outputs.target }}
          REPORT_PLAN: ${{ needs.period.outputs.plan }}
          REVIEWED_SYNC_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.run_reviewed_once && inputs.manual_sync_completed_for || '' }}
          CONFIRMED_MAIN: ${{ inputs.confirmed_main }}
          REVIEWED_RECOVERY_MAIN: ${{ github.event_name == 'workflow_dispatch' && inputs.run_reviewed_once && inputs.recovery_main || '' }}
        run: |
          set -euo pipefail
          error_file="$RUNNER_TEMP/fee-cloud-private/producer-error.txt"
          args=(--mode=produce "--report-kind=$REPORT_KIND" "--report-target=$REPORT_TARGET" \
            "--report-plan=$REPORT_PLAN" "--benchmark-file=$RUNNER_TEMP/fee-cloud-private/benchmark-close.json" \
            "--out-dir=$RUNNER_TEMP/fee-cloud-private")
          if [[ -n "$REVIEWED_SYNC_DATE" ]]; then
            args+=("--manual-sync-completed-for=$REVIEWED_SYNC_DATE")
          fi
          if [[ -n "$CONFIRMED_MAIN" ]]; then
            args+=("--confirmed-main=$CONFIRMED_MAIN")
          fi
          if [[ -n "$REVIEWED_RECOVERY_MAIN" ]]; then
            args+=("--recovery-main=$REVIEWED_RECOVERY_MAIN")
          fi
          if ! summary=$(node scripts/fee-report-producer.mjs "${args[@]}" 2>"$error_file"); then
            node --input-type=module - "$error_file" <<'NODE'
          import fs from 'node:fs';
          import {safeProducerFailureSummary} from './scripts/fee-cloud-producer.mjs';
          let privateStderr='';
          try {
            const fd=fs.openSync(process.argv[2],'r');
            try { const bytes=Buffer.alloc(65537),size=fs.readSync(fd,bytes,0,bytes.length,0);if(size<=65536)privateStderr=bytes.subarray(0,size).toString('utf8'); }
            finally { fs.closeSync(fd); }
          } catch {}
          const {code,diagnostic}=safeProducerFailureSummary(privateStderr);
          const safeDiagnostic=diagnostic?JSON.stringify(diagnostic):null;
          if(safeDiagnostic)process.stdout.write(safeDiagnostic+'\n');
          process.stdout.write(code+'\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,[
            '## Fee cloud producer','','- Outcome: failed closed',`- Diagnostic code: \`${code}\``,
            ...(safeDiagnostic?['','```json',safeDiagnostic,'```']:[]),
            '','No portfolio amounts or credentials are included in this summary.',''
          ].join('\n'));
          NODE
            exit 1
          fi
          node - "$summary" >> "$GITHUB_STEP_SUMMARY" <<'NODE'
          const result = JSON.parse(process.argv[2]);
          if (result.schema !== 'fee-console.cloud-producer.v1') throw new Error('unexpected producer summary');
          process.stdout.write([
            '## Fee cloud producer', '',
            `- Report: ${result.reportKind}`,
            `- Accounting cutoff: ${result.accountingThrough}`,
            `- Price cutoff: ${result.priceThrough}`,
            `- Reconstructed calendar days: ${result.reconstructedDays}`,
            `- Outcome: ${result.outcome}`,
            `- Transient source retries: ${result.retryCount}`,
            `- Source dates: Schwab ${result.sourceDates.schwab}; Webull ${result.sourceDates.webull}; benchmark ${result.sourceDates.benchmark}`,
            ...(result.ibManager ? [`- Independent IB: ${result.ibManager.state === 'verified' ? 'verified' : 'pending'}${/^IB_SOURCE_[A-Z_]{1,48}$/.test(result.ibManager.reasonCode || '') ? ` (${result.ibManager.reasonCode})` : ''}`] : []),
            '', 'No portfolio amounts or credentials are included in this summary.', ''
          ].join('\n'));
          NODE
          target=$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(x.targetDate)' "$summary")
          outcome=$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(x.outcome)' "$summary")
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

      - name: Create a signed owner candidate
        id: candidate
        if: ${{ vars.FEE_CLOUD_MODE == 'publish' && needs.period.outputs.outcome == 'produce' }}
        shell: bash
        env:
          FEE_CLOUD_GITHUB_TOKEN: ${{ secrets.FEE_CLOUD_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/fee-cloud-commit.mjs \
            --data="$RUNNER_TEMP/fee-cloud-private/data.json" \
            --health="$RUNNER_TEMP/fee-cloud-private/fee-data-health.json" \
            --base-sha="$(git rev-parse HEAD)"

      - name: Explain shadow mode
        if: ${{ vars.FEE_CLOUD_MODE == 'shadow' && needs.period.outputs.outcome == 'produce' }}
        shell: bash
        run: echo 'Shadow mode validated the full private calculation and intentionally published nothing.' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove private runtime files
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -d "$RUNNER_TEMP/fee-cloud-private" ]]; then
            find "$RUNNER_TEMP/fee-cloud-private" -type f -exec shred -u {} + 2>/dev/null || true
            rm -rf "$RUNNER_TEMP/fee-cloud-private"
          fi

  once-finish:
    needs: [period, once-admit, produce]
    if: ${{ !inputs.ib_diagnostic_once && !inputs.ib_diagnostic_main && !inputs.ratio_plan && !inputs.ratio_main && !inputs.ib_envelope_once && !inputs.ib_envelope_main && !inputs.confirmed_main && always() && vars.FEE_REPORT_ONCE_MAIN != '' && !inputs.source_probe_once && !inputs.source_probe_main && !inputs.source_probe_target }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ vars.FEE_REPORT_ONCE_MAIN }}
          persist-credentials: false
      - name: Bind the unique candidate or pause after failure
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FEE_REPORT_ONCE_MAIN: ${{ vars.FEE_REPORT_ONCE_MAIN }}
          ONCE_CANDIDATE_SHA: ${{ needs.produce.outputs.candidate }}
          ONCE_PRODUCE_RESULT: ${{ needs.produce.result }}
          ONCE_ADMIT_RESULT: ${{ needs['once-admit'].result }}
        run: node scripts/fee-report-producer.mjs --mode=once-finish

  source-plan-check:
    name: Public source plan check ${{ inputs.source_target }}
    if: ${{ !inputs.ib_diagnostic_once && !inputs.ib_diagnostic_main && !inputs.ratio_plan && !inputs.ratio_main && !inputs.ib_envelope_once && !inputs.ib_envelope_main && !inputs.confirmed_main && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && inputs.report_kind != 'automatic-daily' && inputs.source_plan_check_only && !inputs.source_acceptance_once && !inputs.run_reviewed_once && !inputs.source_probe_once && !inputs.source_probe_main && !inputs.source_probe_target }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
