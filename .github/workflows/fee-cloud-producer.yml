          FEE_REPORT_ACTIONS_TOKEN: ${{ github.token }}
          FEE_CLOUD_SHARESIGHT_CLIENT_ID: ${{ steps.diagnostic_credentials.outputs.client_id }}
          FEE_CLOUD_SHARESIGHT_CLIENT_SECRET: ${{ steps.diagnostic_credentials.outputs.client_secret }}
          FEE_DATA_KEY: ${{ secrets.FEE_DATA_KEY }}
          FEE_ECON_GIST_ID: ${{ secrets.FEE_ECON_GIST_ID }}
          IB_MANAGER_READ_ENABLED: 'true'
          IB_MANAGER_BASELINE_SHA256: ${{ vars.IB_MANAGER_BASELINE_SHA256 }}
        run: node scripts/fee-source-revision-diagnostic.mjs --expected-main="$DIAGNOSTIC_MAIN"
      - name: Remove diagnostic temporary inputs without artifacts
