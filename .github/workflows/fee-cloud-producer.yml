            --target-date="$SOURCE_TARGET" --out-dir="$RUNNER_TEMP/fee-source-plan-check"

  source-acceptance:
    name: Source acceptance ${{ inputs.source_target }}
    if: ${{ !inputs.ib_diagnostic_once && !inputs.ib_diagnostic_main && !inputs.ratio_plan && !inputs.ratio_main && !inputs.ib_envelope_once && !inputs.ib_envelope_main && !inputs.confirmed_main && vars.FEE_REPORT_ONCE_MAIN == '' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && inputs.report_kind != 'automatic-daily' && !inputs.source_plan_check_only && inputs.source_acceptance_once && !inputs.run_reviewed_once && !inputs.source_probe_once && !inputs.source_probe_main && !inputs.source_probe_target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: fee-cloud-producer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - name: Validate frozen code, date range and field-check plan before credentials
        env:
          SOURCE_MAIN: ${{ inputs.source_main }}
          SOURCE_FROM: ${{ inputs.source_from }}
          SOURCE_TARGET: ${{ inputs.source_target }}
        run: |
          set -euo pipefail
          node scripts/fee-source-acceptance.mjs --check-plan \
            --expected-main="$SOURCE_MAIN" --from-date="$SOURCE_FROM" \
            --target-date="$SOURCE_TARGET" --out-dir="$RUNNER_TEMP/fee-source-acceptance"
      - name: Exchange the existing trusted read identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: family-portfolio-gateway
          workload_identity_provider: projects/860729177589/locations/global/workloadIdentityPools/fee-console-github/providers/fee-console-main
          service_account: fee-cloud-producer@family-portfolio-gateway.iam.gserviceaccount.com
      - name: Read only the existing Sharesight OAuth pair
        id: source_credentials
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262
        with:
          secrets: |-
            client_id:family-portfolio-gateway/sharesight-broker-sync-client-id/1
            client_secret:family-portfolio-gateway/sharesight-broker-sync-client-secret/1
      - name: Capture the fixed private source evidence and field summary
        env:
          SOURCE_MAIN: ${{ inputs.source_main }}
          SOURCE_FROM: ${{ inputs.source_from }}
          SOURCE_TARGET: ${{ inputs.source_target }}
          FEE_CLOUD_SHARESIGHT_CLIENT_ID: ${{ steps.source_credentials.outputs.client_id }}
          FEE_CLOUD_SHARESIGHT_CLIENT_SECRET: ${{ steps.source_credentials.outputs.client_secret }}
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/fee-source-acceptance"
          node scripts/fee-source-acceptance.mjs \
            --expected-main="$SOURCE_MAIN" --from-date="$SOURCE_FROM" \
            --target-date="$SOURCE_TARGET" --out-dir="$RUNNER_TEMP/fee-source-acceptance"
      - name: Remove private field evidence without uploading artifacts
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/fee-source-acceptance" ]]; then
            find "$RUNNER_TEMP/fee-source-acceptance" -type f -exec shred -u {} + 2>/dev/null || true
            rm -rf "$RUNNER_TEMP/fee-source-acceptance"
          fi

  ratio-preflight:
    if: ${{ !inputs.ib_diagnostic_once && !inputs.ib_diagnostic_main && !inputs.confirmed_main && !inputs.ib_envelope_once && !inputs.ib_envelope_main && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor_id == '283054367' && github.run_attempt == 1 && inputs.report_kind != 'automatic-daily' && inputs.ratio_plan != '' && inputs.ratio_main == github.sha && !inputs.run_reviewed_once && !inputs.source_plan_check_only && !inputs.source_acceptance_once && !inputs.source_probe_once && !inputs.source_probe_main && !inputs.source_probe_target }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Check out exact reviewed ratio code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate manual ratio admission without financial credentials
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RATIO_PLAN: ${{ inputs.ratio_plan }}
        run: node scripts/fee-ratio-cloud-runtime.mjs --preflight

  ratio:
    needs: ratio-preflight
    # Fee-first critical section, shared only with the protected promote job.
    # Job-level and FIFO-queued (never replaced, never cancelled for a newer
    # run while queue room remains). A holder never waits on another workflow,
    # so no cycle with the outer fee-cloud-producer / promote-fee-data groups.
    concurrency:
      group: fee-publication-critical
      cancel-in-progress: false
      queue: max
    if: ${{ !inputs.ib_diagnostic_once && !inputs.ib_diagnostic_main && !inputs.confirmed_main && !inputs.ib_envelope_once && !inputs.ib_envelope_main && needs.ratio-preflight.result == 'success' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.ratio_main == github.sha && !inputs.source_probe_once && !inputs.source_probe_main && !inputs.source_probe_target }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: fee-cloud-producer
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out exact reviewed ratio code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Authenticate existing cloud identity for pinned ratio inputs only
        if: ${{ fromJSON(inputs.ratio_plan).mode == 'publish' }}
        id: ratio-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/860729177589/locations/global/workloadIdentityPools/fee-console-github/providers/fee-console-main
          service_account: fee-cloud-producer@family-portfolio-gateway.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: https://www.googleapis.com/auth/devstorage.read_write
          create_credentials_file: false
          export_environment_variables: false
      - name: Execute only the reviewed ratio operation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RATIO_PLAN: ${{ inputs.ratio_plan }}
          RATIO_STORAGE_ACCESS_TOKEN: ${{ steps.ratio-auth.outputs.access_token }}
          FEE_RATIO_MANAGER_TOKEN: ${{ secrets.FEE_RATIO_MANAGER_TOKEN }}
          FEE_DATA_KEY: ${{ secrets.FEE_DATA_KEY }}
          FEE_ECON_GIST_ID: ${{ secrets.FEE_ECON_GIST_ID }}
          IB_MANAGER_BASELINE_SHA256: ${{ vars.IB_MANAGER_BASELINE_SHA256 }}
        run: node scripts/fee-ratio-cloud-runtime.mjs --run
      - name: Retain only the closed safe ratio result
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ratio-result-${{ github.run_id }}
          path: ${{ runner.temp }}/fee-ratio-result.safe.json
          if-no-files-found: warn
          retention-days: 7

  ib-diagnostic:
    name: IB diagnostic 2026-11-06
    if: ${{ !inputs.confirmed_main && inputs.ib_diagnostic_once && inputs.ib_diagnostic_main == github.sha && !inputs.ib_envelope_once && !inputs.ib_envelope_main && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor_id == '283054367' && github.run_attempt == 1 && !inputs.source_probe_once && !inputs.source_probe_main && !inputs.source_probe_target }}
    runs-on: ubuntu-latest
