name: Watch XUAN-IB fixed page freshness

on:
  schedule:
    # Every 30 minutes on weekdays. The script is silent before 08:30 HKT,
    # checks AM from 08:30, and checks PM from 22:15 (first cron after: 22:30).
    - cron: '*/30 * * * 1-5'
  workflow_dispatch:
    inputs:
      expected_edition:
        description: Expected scheduled edition (auto uses the current HKT SLA)
        type: choice
        required: true
        default: auto
        options:
          - auto
          - am
          - pm

permissions:
  contents: read

concurrency:
  group: watch-xuan-ib-fixed-page-freshness
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0

      - name: Verify the scheduled edition reached the fixed mobile page
        shell: bash
        env:
          MANUAL_EDITION: ${{ inputs.expected_edition }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          set -uo pipefail
          expected=${MANUAL_EDITION:-auto}
          [[ -n "$SCHEDULE_EXPRESSION" ]] && expected=auto
          repo_name=${GITHUB_REPOSITORY#*/}
          base_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repo_name}/xuan-ib/"
          set +e
          result=$(node scripts/xuan-ib-publish-health.mjs watch \
            --base-url "$base_url" \
            --main-html xuan-ib/latest.html \
            --main-meta xuan-ib/latest.meta.json \
            --expected "$expected" 2>&1)
          status=$?
          set -e
          if (( status != 0 )); then
            {
              echo '### XUAN-IB fixed-page freshness failure'
              echo ''
              echo 'The stable mobile page did not prove the expected scheduled edition.'
              echo ''
              echo '```json'
              printf '%s\n' "$result" | jq . 2>/dev/null || printf '%s\n' "$result"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$result" >&2
            exit "$status"
          fi
          # A healthy or deliberately skipped check is silent. GitHub already
          # records the successful workflow run; no notification state is stored.
