name: Validate fee-console data candidate

# Runs on every Routine data push to a claude/* branch. Its only job is to
# sanity-check the candidate envelope and, by completing, wake the trusted
# promote-fee-data workflow (workflow_run, executed from main) so promotion
# happens within minutes of the push instead of waiting for a cron window.
# This workflow has no secrets and writes nothing; promote-fee-data
# re-validates every candidate from the trusted default branch.

on:
  push:
    branches:
      - 'claude/**'
    paths:
      - data.json
      - fee-data-health.json

permissions:
  contents: read

concurrency:
  group: validate-fee-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pushed candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify candidate boundary
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin main:refs/remotes/origin/main
          branch_name=${GITHUB_REF#refs/heads/}
          if [[ ! "$branch_name" =~ ^claude/[a-z0-9-]+-[a-z0-9]{6}$ ]]; then
            echo "Unexpected Routine branch: $branch_name" >&2
            exit 1
          fi

          if [[ $(git rev-list --count "origin/main..HEAD") -ne 1 ]] ||
             [[ $(git rev-list --count --merges "origin/main..HEAD") -ne 0 ]] ||
             [[ $(git rev-parse HEAD^) != $(git rev-parse origin/main) ]]; then
            echo 'Candidate must be exactly one non-merge commit on current main.' >&2
            exit 1
          fi

          mapfile -t changed_files < <(git diff --name-only origin/main..HEAD)
          if (( ${#changed_files[@]} < 1 || ${#changed_files[@]} > 2 )) ||
             [[ ! " ${changed_files[*]} " =~ " fee-data-health.json " ]] ||
             printf '%s\n' "${changed_files[@]}" | grep -Evqx 'data\.json|fee-data-health\.json'; then
            echo 'Candidate must include the public health receipt and may otherwise change only data.json.' >&2
            printf 'Changed: %s\n' "${changed_files[@]}" >&2
            exit 1
          fi

          read -r author_email committer_email subject < <(
            git show -s --format='%ae%x09%ce%x09%s' HEAD
          )
          if [[ "$author_email" != 'noreply@anthropic.com' ]] ||
             [[ "$committer_email" != 'noreply@anthropic.com' ]] ||
             [[ ! "$subject" =~ ^daily\ ([0-9]{4}-[0-9]{2}-[0-9]{2})$ ]]; then
            echo 'Candidate provenance or commit subject is invalid.' >&2
            exit 1
          fi

          data_date=${BASH_REMATCH[1]}
          health_date=$(jq -r '.targetDate // empty' fee-data-health.json)
          if [[ "$health_date" != "$data_date" ]]; then
            echo 'Commit subject and health target date differ.' >&2
            exit 1
          fi
          target_epoch=$(date -u -d "$data_date" +%s)
          today_epoch=$(date -u -d "$(date -u +%F)" +%s)
          target_age_days=$(( (today_epoch - target_epoch) / 86400 ))
          if (( target_age_days < 0 || target_age_days > 4 )); then
            echo "Candidate target date is outside the safe catch-up window: $data_date" >&2
            exit 1
          fi

          now_epoch=$(date -u +%s)
          commit_epoch=$(git show -s --format='%ct' HEAD)
          if (( commit_epoch < now_epoch - 129600 || commit_epoch > now_epoch + 300 )); then
            echo 'Candidate commit time is stale or implausibly in the future.' >&2
            exit 1
          fi

      - name: Verify GitHub identity and signature
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r verified author_login committer_login < <(
            curl --fail --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" |
              jq -r '[.commit.verification.verified, .author.login, .committer.login] | @tsv'
          )
          if [[ "$verified" != 'true' ]] ||
             [[ "$author_login" != 'claude' ]] ||
             [[ "$committer_login" != 'claude' ]]; then
            echo 'Candidate is not a GitHub-verified Claude commit.' >&2
            exit 1
          fi

      - name: Verify data.json is an encrypted v3 envelope
        shell: bash
        run: |
          size_bytes=$(wc -c < data.json)
          if (( size_bytes >= 2097152 )); then
            echo 'data.json is too large.' >&2
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const outer = JSON.parse(fs.readFileSync('data.json', 'utf8'));
          if (!outer || typeof outer !== 'object' || Array.isArray(outer)) {
            throw new Error('data.json must be a JSON object');
          }
          if (outer.enc !== true || outer.v !== 3) {
            throw new Error('data.json must use the encrypted v3 envelope');
          }
          if (typeof outer.data !== 'string' || outer.data.length < 40 || outer.data.length % 4 !== 0) {
            throw new Error('data.json ciphertext has an invalid length');
          }
          if (!/^[A-Za-z0-9+/]+={0,2}$/.test(outer.data)) {
            throw new Error('data.json ciphertext is not standard base64');
          }
          if (Buffer.from(outer.data, 'base64').toString('base64') !== outer.data) {
            throw new Error('data.json ciphertext is not canonical base64');
          }
          console.log('envelope ok');
          NODE

      - name: Verify amount-free run receipt and outcome
        shell: bash
        run: |
          set -euo pipefail
          node scripts/fee-data-health.mjs validate --health=fee-data-health.json --data=data.json
          outcome=$(jq -r '.outcome' fee-data-health.json)
          mapfile -t changed_files < <(git diff --name-only origin/main..HEAD)
          data_changed=false
          printf '%s\n' "${changed_files[@]}" | grep -qx 'data.json' && data_changed=true
          case "$outcome" in
            updated)
              [[ "$data_changed" == true ]] || { echo 'updated requires a data.json change' >&2; exit 1; }
              ;;
            no-op)
              [[ "$data_changed" == false ]] || { echo 'no-op must leave data.json byte-identical' >&2; exit 1; }
              ;;
            failed)
              echo "Daily producer reported fixed failure code: $(jq -r '.errorCode' fee-data-health.json)" >&2
              exit 1
              ;;
            *)
              echo 'Unexpected daily producer outcome.' >&2
              exit 1
              ;;
          esac
