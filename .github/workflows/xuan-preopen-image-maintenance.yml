name: XUAN preopen immutable image maintenance

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: 'Exact signed OWNER-approved head of the merged maintenance PR'
        required: true
        type: string
      approval_pr:
        description: 'Merged PR containing the existing exact-head OWNER approval'
        required: true
        type: string
      image_kind:
        description: 'Fixed image target: report maintenance or build-only action preview'
        required: true
        type: choice
        options: [report, preview]
        default: report
      deploy_image:
        description: 'Also replace the fixed production job image; keep false for private acceptance'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: xuan-preopen-image-maintenance
  cancel-in-progress: false

jobs:
  build:
    if: ${{ vars.XUAN_PREOPEN_IMAGE_MAINTENANCE_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository_id == '1334738755' && github.repository_owner_id == '283054367' && github.actor_id == '283054367' }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    uses: huanwujoy-crypto/fee-console/.github/workflows/xuan-preopen-image-build.yml@main
    with:
      approved_sha: ${{ inputs.approved_sha }}
      approval_pr: ${{ inputs.approval_pr }}
      image_kind: ${{ inputs.image_kind }}
      deploy_image: ${{ inputs.deploy_image }}
  deploy:
    needs: build
    if: ${{ inputs.deploy_image == true && needs.build.result == 'success' && inputs.image_kind != 'preview' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    uses: huanwujoy-crypto/fee-console/.github/workflows/xuan-preopen-image-deploy.yml@main
    with:
      approved_sha: ${{ inputs.approved_sha }}
      approval_pr: ${{ inputs.approval_pr }}
      built_digest: ${{ needs.build.outputs.image_digest }}
